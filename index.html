<script>
/* === kit:sandi === */
/* =====================================================================
 *  KitSandi — PIN perangkat bersama LENSA Suite (Tahap 3).
 *  Data di perangkat dikunci dengan PIN: kunci AES-GCM 256 bit diturunkan dari PIN (PBKDF2-SHA256, 250.000 putaran),
 *  isi dimampatkan (gzip) lalu disandikan. Rumus sama dengan PIN LENSA PK 2.x, sehingga semua aplikasi seragam.
 *  PIN tidak pernah disimpan; yang tersimpan hanya garam + isi tersandi. Lupa PIN = data di perangkat harus dihapus
 *  (data di Google Sheet tetap aman), lalu masuk lagi dengan kode undangan.
 * ===================================================================== */
var KitSandi = (function () {
  var ULANG = 250000;
  function keB64(buf) { var u = buf instanceof Uint8Array ? buf : new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i + 8192)); return btoa(s); }
  function dariB64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function pinSah(pin) { return /^\d{4,12}$/.test(String(pin || '')); }
  function garamBaru() { return crypto.getRandomValues(new Uint8Array(16)); }
  async function kunciDariPin(pin, garam) {
    var dasar = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(pin)), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: garam, iterations: ULANG, hash: 'SHA-256' }, dasar, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function mampat(teks) {
    var b = new TextEncoder().encode(teks);
    if (typeof CompressionStream === 'undefined') return { z: 0, b: b };
    var s = new Blob([b]).stream().pipeThrough(new CompressionStream('gzip'));
    return { z: 1, b: new Uint8Array(await new Response(s).arrayBuffer()) };
  }
  async function urai(b, z) {
    if (!z) return new TextDecoder().decode(b);
    var s = new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(s).text();
  }
  /** obj → rekaman tersandi { terkunci, garam, iv, z, isi (ArrayBuffer) }. */
  async function sandikan(obj, kunci, garam) {
    var m = await mampat(JSON.stringify(obj)), iv = crypto.getRandomValues(new Uint8Array(12));
    var isi = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, kunci, m.b);
    return { terkunci: true, garam: keB64(garam), iv: keB64(iv), z: m.z, isi: isi };
  }
  /** Rekaman tersandi → obj. PIN salah → melempar galat. isi boleh ArrayBuffer atau teks base64 (file cadangan). */
  async function bukaSandi(rek, kunci) {
    var isi = rek.isi instanceof ArrayBuffer || ArrayBuffer.isView(rek.isi) ? rek.isi : dariB64(rek.isi);
    var b = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: dariB64(rek.iv) }, kunci, isi);
    return JSON.parse(await urai(new Uint8Array(b), rek.z));
  }
  /** Rekaman tersandi untuk disimpan sebagai teks (localStorage / file cadangan). */
  function keTeks(rek) { return Object.assign({}, rek, { isi: keB64(rek.isi) }); }
  return { ULANG: ULANG, pinSah: pinSah, garamBaru: garamBaru, kunciDariPin: kunciDariPin, sandikan: sandikan, bukaSandi: bukaSandi, keTeks: keTeks, keB64: keB64, dariB64: dariB64 };
})();

/* === 20-simpan.js === */
/* ----------------------------------------------------------------------
 *  SIGAP Jakon 2.0 · penyimpanan di perangkat (IndexedDB "sigap_jakon", cadangan memori) + PIN pilihan (kit/sandi.js).
 *  Yang disimpan: sambungan perangkat (alamat, idp, token), data awal terakhir (NIK sudah disamarkan server),
 *  galat yang belum terkirim. NIK utuh dan foto KTP TIDAK PERNAH disimpan di perangkat.
 * ---------------------------------------------------------------------- */
var VERSI_APP = '2.1.1';
var NAMA_DB = 'sigap_jakon', KUNCI_DB = 'state';
var HARI_KUNCI = 7; // seperti aplikasi LENSA Suite lain: 7 hari tidak tersambung → data tersimpan tidak ditampilkan

function dbKosong() {
  return { versi: VERSI_APP, sinkron: { url: '', idp: '', token: '', idKlien: '', akses: null, terakhirOk: 0 }, awal: null, awalT: 0, galatAntre: [] };
}
var DB = dbKosong();
var SIMPAN = { jenis: 'memori', kunci: null, garam: null, rekTerkunci: null, tertunda: null, antre: Promise.resolve() };
var _idb = null;

function bukaIdb() {
  return new Promise(function (ok, gagal) {
    if (typeof indexedDB === 'undefined') return gagal(new Error('IndexedDB tidak tersedia'));
    var req = indexedDB.open(NAMA_DB, 1);
    req.onupgradeneeded = function () { req.result.createObjectStore('kv'); };
    req.onsuccess = function () { ok(req.result); };
    req.onerror = function () { gagal(req.error || new Error('IndexedDB gagal dibuka')); };
  });
}
function idbAmbil() {
  return new Promise(function (ok, gagal) {
    var r = _idb.transaction('kv', 'readonly').objectStore('kv').get(KUNCI_DB);
    r.onsuccess = function () { ok(r.result || null); }; r.onerror = function () { gagal(r.error); };
  });
}
function idbTaruh(isi) {
  return new Promise(function (ok, gagal) {
    var tx = _idb.transaction('kv', 'readwrite');
    if (isi === null) tx.objectStore('kv').delete(KUNCI_DB); else tx.objectStore('kv').put(isi, KUNCI_DB);
    tx.oncomplete = function () { ok(); }; tx.onerror = function () { gagal(tx.error); };
  });
}
function lengkapiDb(d) {
  var k = dbKosong();
  Object.keys(k).forEach(function (x) { if (d[x] === undefined) d[x] = k[x]; });
  Object.keys(k.sinkron).forEach(function (x) { if (d.sinkron[x] === undefined) d.sinkron[x] = k.sinkron[x]; });
  d.versi = VERSI_APP;
  return d;
}
async function muatDb() {
  var data = null;
  try { _idb = await bukaIdb(); data = await idbAmbil(); SIMPAN.jenis = 'idb'; }
  catch (e) { _idb = null; SIMPAN.jenis = 'memori'; }
  if (data && data.terkunci) { SIMPAN.rekTerkunci = data; DB = dbKosong(); return DB; }
  DB = lengkapiDb(data || dbKosong());
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e2) { /* pilihan */ }
  return DB;
}
/** Tulis berurutan; bila PIN terpasang, isi disandikan (AES-GCM dari PIN, rumus sama dengan LENSA PK). */
function tulisDb() {
  SIMPAN.antre = SIMPAN.antre.then(async function () {
    if (!_idb || SIMPAN.rekTerkunci || SIMPAN.dihapus) return;
    var isi = JSON.parse(JSON.stringify(DB));
    if (SIMPAN.kunci) isi = await KitSandi.sandikan(isi, SIMPAN.kunci, SIMPAN.garam);
    await idbTaruh(isi);
  }).catch(function (e) { catatGalat('simpan', e && e.message || e); });
  return SIMPAN.antre;
}
function simpanDb(segera) {
  if (SIMPAN.tertunda) clearTimeout(SIMPAN.tertunda);
  if (segera) return tulisDb();
  SIMPAN.tertunda = setTimeout(tulisDb, 200);
}
/** Hapus semua data SIGAP di perangkat ini (dicabut / keluar / lupa PIN), termasuk sisa versi 1 di localStorage. */
async function hapusDataPerangkat() {
  if (SIMPAN.tertunda) clearTimeout(SIMPAN.tertunda);
  SIMPAN.dihapus = true; // tidak ada tulisan lagi sampai masuk dengan kode undangan baru
  try { await SIMPAN.antre; } catch (e) { /* diam */ }
  DB = dbKosong(); SIMPAN.kunci = null; SIMPAN.garam = null; SIMPAN.rekTerkunci = null;
  try { if (!_idb) _idb = await bukaIdb(); await idbTaruh(null); } catch (e) { /* diam */ }
  bersihkanVersiLama();
}
/** SIGAP 1.x menyimpan token & data awal (termasuk NIK pekerja untuk admin CV) di localStorage: dibuang. */
function bersihkanVersiLama() { try { localStorage.removeItem('sigap_token'); localStorage.removeItem('sigap_awal'); } catch (e) { /* diam */ } }

/* ---------- PIN (pilihan) ---------- */
function pinAktif() { return !!SIMPAN.kunci; }
async function bukaDenganPin(pin) {
  var rek = SIMPAN.rekTerkunci;
  if (!rek) return true;
  var garam = KitSandi.dariB64(rek.garam), k = await KitSandi.kunciDariPin(pin, garam), d;
  try { d = await KitSandi.bukaSandi(rek, k); } catch (e) { return false; }
  SIMPAN.kunci = k; SIMPAN.garam = garam; SIMPAN.rekTerkunci = null;
  DB = lengkapiDb(d);
  return true;
}
async function pasangPin(pin) {
  if (!KitSandi.pinSah(pin)) throw new Error('PIN harus 4–12 angka.');
  SIMPAN.garam = KitSandi.garamBaru();
  SIMPAN.kunci = await KitSandi.kunciDariPin(pin, SIMPAN.garam);
  await simpanDb(true);
}
async function lepasPin() { SIMPAN.kunci = null; SIMPAN.garam = null; await simpanDb(true); }

/* ---------- galat aplikasi → Pusat Kendali LENSA (lewat server SIGAP) ---------- */
function catatGalat(tempat, pesan) {
  try {
    var p = String(pesan || '').replace(/\d{12,}/g, '[angka]').slice(0, 400); // NIK / deret angka panjang tidak pernah dikirim
    if (!p || DB.galatAntre.some(function (g) { return g.pesan === p; })) return;
    DB.galatAntre.push({ waktu: new Date().toISOString().replace('T', ' ').slice(0, 19), tempat: String(tempat || '').slice(0, 100), pesan: p });
    if (DB.galatAntre.length > 20) DB.galatAntre.splice(0, DB.galatAntre.length - 20);
    simpanDb();
  } catch (e) { /* diam */ }
}
window.addEventListener('error', function (e) { catatGalat('halaman', (e && e.message) + (e && e.filename ? ' @ ' + String(e.filename).split('/').pop() + ':' + e.lineno : '')); });
window.addEventListener('unhandledrejection', function (e) { var r = e && e.reason; catatGalat('janji', r && r.message || r); });

 *  (awalan "SGJ." = alamat /exec + kode sekali pakai), panggilan ke server dengan idp + token perangkat,
 *  Keluar, dicabut = data di perangkat dihapus, PIN pilihan.

var AWALAN_UNDANGAN = 'SGJ.';
var KUNCI_SINKRON_MS = HARI_KUNCI * 864e5;

function namaPerangkat() {
  var u = navigator.userAgent || '', b = /Edg\//.test(u) ? 'Edge' : /Firefox\//.test(u) ? 'Firefox' : /Chrome\//.test(u) ? 'Chrome' : /Safari\//.test(u) ? 'Safari' : 'Peramban';
  var o = /Android/.test(u) ? 'Android' : /iPhone|iPad/.test(u) ? 'iOS' : /Windows/.test(u) ? 'Windows' : /Mac OS/.test(u) ? 'macOS' : /Linux/.test(u) ? 'Linux' : '';
  return b + (o ? ' · ' + o : '');
}
function idKlien() { if (!DB.sinkron.idKlien) DB.sinkron.idKlien = 'K' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); return DB.sinkron.idKlien; }
function terdaftar() { return !!(DB.sinkron.idp && DB.sinkron.token && DB.sinkron.url); }

/** "SGJ.eyJ1Ijoi…" → { url, kode }. */
function bacaKodeUndangan(teks) {
  var t = String(teks || '').replace(/\s+/g, '');
  if (t.indexOf(AWALAN_UNDANGAN) !== 0) throw new Error('Kode undangan SIGAP diawali "' + AWALAN_UNDANGAN + '". Salin seluruh kode dari pesan undangan.');
  var o;
  try { o = JSON.parse(decodeURIComponent(escape(atob(t.slice(AWALAN_UNDANGAN.length))))); } catch (e) { throw new Error('Kode undangan tidak terbaca. Salin ulang seluruh kode dari pesan undangan.'); }
  if (!o || !/^https:\/\/script\.google\.com\//.test(o.u || '') || !o.c) throw new Error('Kode undangan tidak lengkap.');
  return { url: o.u, kode: o.c };
}

async function kirimKe(url, isi) {
  var r;
  try {
    r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(isi), redirect: 'follow' });
  } catch (e) { throw new Error(navigator.onLine === false ? 'Tidak ada koneksi internet' : 'Gagal menghubungi server: ' + (e && e.message || e)); }
  if (!r.ok) throw new Error('Server menjawab ' + r.status);
  var teks = await r.text();
  try { return JSON.parse(teks); } catch (e) { throw new Error(/<html/i.test(teks) ? 'Alamat server salah, atau deployment SIGAP belum "Siapa saja".' : 'Jawaban server tidak terbaca.'); }
}

/** Panggilan berdata (peran disaring di server). Galat yang tertunda ikut terkirim. */
async function panggilServer(fn, arg) {
  if (!terdaftar()) throw new Error('Perangkat belum masuk.');
  var galat = DB.galatAntre.splice(0);
  var j;
  try {
    j = await kirimKe(DB.sinkron.url, { aksi: 'panggil', idp: DB.sinkron.idp, token: DB.sinkron.token, fn: fn, arg: arg || {}, versiApp: VERSI_APP, perangkat: namaPerangkat(), galat: galat });
  } catch (e) { DB.galatAntre = galat.concat(DB.galatAntre).slice(-20); simpanDb(); throw e; }
  if (!j.ok) {
    if (j.cabut) { await dicabut(j.galat); throw new Error(j.galat); }
    if (galat.length) simpanDb();
    throw new Error(j.galat || 'Gagal');
  }
  if (j.akses) DB.sinkron.akses = j.akses;
  DB.sinkron.terakhirOk = Date.now();
  simpanDb();
  return j.data;
}
/** Formulir "Minta akses" (tanpa kode): alamat server dari config.js. */
async function panggilPublik(aksi, arg) {
  var url = window.SIGAP_API || DB.sinkron.url;
  if (!url || /GANTI_DENGAN/.test(url)) throw new Error('Alamat server belum diatur. Minta kode undangan langsung ke petugas KC.');
  var j = await kirimKe(url, { aksi: aksi, arg: arg || {} });
  if (!j.ok) throw new Error(j.error || j.galat || 'Gagal');
  return j.data;
}

async function masukDenganKode(teks) {
  var k = bacaKodeUndangan(teks);
  var j = await kirimKe(k.url, { aksi: 'gabung', kode: k.kode, perangkat: namaPerangkat(), idKlien: idKlien(), versiApp: VERSI_APP });
  if (!j.ok) throw new Error(j.galat || 'Kode undangan ditolak.');
  DB.sinkron.url = k.url; DB.sinkron.idp = j.idp; DB.sinkron.token = j.token; DB.sinkron.akses = j.akses; DB.sinkron.terakhirOk = Date.now();
  DB.awal = null; DB.awalT = 0; SIMPAN.dihapus = false;
  await simpanDb(true);
  return j.akses;
}

var STATUS_CV = ['Terdaftar aktif', 'Menunggak', 'Nonaktif', 'Belum terdaftar / perlu cek'];

// ---------- util ----------
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function rp(n) { n = Number(n); return isNaN(n) || !n ? '-' : 'Rp ' + n.toLocaleString('id-ID', { maximumFractionDigits: 0 }); }
function jt(n) { n = Number(n); if (!n) return '-'; return n >= 1e9 ? (n / 1e9).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' M' : (n / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' jt'; }
function bln(ym) { var b = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des']; var m = String(ym || '').match(/^(\d{4})-(\d{2})/); return m ? b[+m[2] - 1] + ' ' + m[1] : (ym || ''); }
function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function thisMonth() { return today().slice(0, 7); }
function hp62(v) { var s = String(v || '').replace(/\D/g, ''); if (s[0] === '0') s = '62' + s.slice(1); if (s[0] === '8') s = '62' + s; return s; }
function waLink(no, teks) { return 'https://api.whatsapp.com/send?phone=' + hp62(no) + '&text=' + encodeURIComponent(teks); }

function chipCls(s) {
  s = String(s || '').toLowerCase();
  if (s === 'tidak cocok') return 'menunggak'; // 2.1.0 geotag
  if (s === 'dicek petugas') return 'aktif';
  if (s.indexOf('menunggak') >= 0 || s.indexOf('ditolak') >= 0 || s.indexOf('dibatalkan') >= 0) return 'menunggak';
  if (s.indexOf('nonaktif') >= 0) return 'nonaktif';
  if (s.indexOf('belum') >= 0 || s.indexOf('ditunda') >= 0 || s.indexOf('perbaikan') >= 0 || s.indexOf('mirip') >= 0 || s.indexOf('tidak ada') >= 0 || s.indexOf('draf') >= 0) return 'belum';
  if (s.indexOf('checklist') >= 0 || s.indexOf('pembayaran') >= 0 || s.indexOf('diverifikasi') >= 0) return 'checklist';
  if (s.indexOf('berjalan') >= 0 || s.indexOf('diajukan') >= 0) return 'berjalan';
  if (s.indexOf('aktif') >= 0 || s.indexOf('selesai') >= 0 || s === 'cocok' || s === 'manual') return 'aktif';
  return '';
}
function chip(s) { return s ? '<span class="chip ' + chipCls(s) + '">' + esc(s) + '</span>' : ''; }

function toast(msg, err) {
  var t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(function () { t.remove(); }, err ? 6000 : 3200);
}

/** 2.0: semua panggilan lewat perangkat terdaftar (idp + token); "Minta akses" tanpa kode lewat config.js. */
function call(aksi, arg) {

  return panggilServer(aksi, arg);
}

/** Jalankan aksi dengan tombol "loading". */
function busy(btn, p, label) {
  var asli = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> ' + (label || 'Memproses…'); }
  return p.then(function (x) { if (btn) { btn.disabled = false; btn.innerHTML = asli; } return x; },
    function (e) { if (btn) { btn.disabled = false; btn.innerHTML = asli; } toast(e.message || String(e), true); throw e; });
}

function modal(html, onReady) {
  var bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal">' + html + '</div>';
  bg.addEventListener('click', function (e) { if (e.target === bg) bg.remove(); });

}

function unduhBase64(r) {
  var bin = atob(r.base64), arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  var url = URL.createObjectURL(new Blob([arr], { type: r.mime }));
  var a = document.createElement('a'); a.href = url; a.download = r.nama; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 4000);
}

function unduhCSV(nama, kolom, rows) {
  var csv = [kolom.map(function (k) { return k[1]; })].concat(rows.map(function (r) { return kolom.map(function (k) { return typeof k[0] === 'function' ? k[0](r) : r[k[0]]; }); }))
    .map(function (r) { return r.map(function (v) { v = String(v == null ? '' : v); return /[",;\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';'); }).join('\n');
  unduhBase64({ base64: btoa(unescape(encodeURIComponent('﻿' + csv))), mime: 'text/csv', nama: nama + '.csv' });
}

/** Baca berkas → base64 (gambar besar diperkecil). */
function bacaBerkas(file) {
  return new Promise(function (ok, gagal) {
    if (!file) return gagal(new Error('Pilih berkas'));
    var tipe = file.type;
    if (!/^(application\/pdf|image\/(jpeg|png|webp))$/.test(tipe) && !/\.(xlsx|xls|csv)$/i.test(file.name)) return gagal(new Error('Format harus PDF, JPG, atau PNG'));
    var r = new FileReader();
    r.onerror = function () { gagal(new Error('Gagal membaca berkas')); };
    r.onload = function () {
      var url = r.result;
      if (/^image\//.test(tipe) && file.size > 900 * 1024) {
        var img = new Image();
        img.onload = function () {
          var maks = 1800, w = img.width, h = img.height, k = Math.min(1, maks / Math.max(w, h));
          var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          ok({ base64: c.toDataURL('image/jpeg', 0.82).split(',')[1], mime: 'image/jpeg', nama: file.name.replace(/\.\w+$/, '.jpg') });
        };
        img.onerror = function () { ok({ base64: url.split(',')[1], mime: tipe, nama: file.name }); };
        img.src = url;
      } else ok({ base64: url.split(',')[1], mime: tipe || 'application/octet-stream', nama: file.name });
    };

/** Tabel generik dengan pencarian. kolom: [[key|fn, judul, cls]] */
function tabel(el, rows, kolom, opt) {
  opt = opt || {};
  var q = (S.f[opt.id + '_q'] || '').toLowerCase();
  var data = rows.filter(function (r) { return !q || JSON.stringify(r).toLowerCase().indexOf(q) >= 0; });
  var html = '<div class="baris" style="margin-bottom:8px"><input type="text" class="cari" placeholder="Cari…" value="' + esc(S.f[opt.id + '_q'] || '') + '" data-q><span class="muted">' + data.length + ' baris</span><span class="sp"></span>' + (opt.csv ? '<button class="btn kecil" data-csv>Unduh CSV</button>' : '') + (opt.tombol || '') + '</div>';
  if (!data.length) html += '<div class="tbl-wrap"><div class="kosong">' + esc(opt.kosong || 'Belum ada data') + '</div></div>';
  else {
    var batas = opt.batas || 300;
    // 2.0.1: opt.hp → di layar HP tiap baris tampil sebagai kartu (judul kolom di kiri), tidak perlu geser ke samping
    html += '<div class="tbl-wrap' + (opt.hp ? ' hp-kartu' : '') + '"><table><thead><tr>' + kolom.map(function (k) { return '<th>' + esc(k[1]) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      data.slice(0, batas).map(function (r, i) { return '<tr class="' + (opt.klik ? 'klik' : '') + '" data-i="' + i + '">' + kolom.map(function (k) { var v = typeof k[0] === 'function' ? k[0](r) : esc(r[k[0]]); return '<td class="' + (k[2] || '') + '" data-l="' + esc(k[1]) + '">' + v + '</td>'; }).join('') + '</tr>'; }).join('') +
      '</tbody></table>' + (data.length > batas ? '<div class="kosong">Menampilkan ' + batas + ' dari ' + data.length + '. Persempit pencarian.</div>' : '') + '</div>';
  }
  el.innerHTML = html;
  var inp = $('[data-q]', el);
  inp.oninput = function () { S.f[opt.id + '_q'] = inp.value; clearTimeout(inp._t); inp._t = setTimeout(function () { tabel(el, rows, kolom, opt); var n = $('[data-q]', el); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
  if (opt.klik) $$('tr.klik', el).forEach(function (tr) { tr.onclick = function () { opt.klik(data[+tr.dataset.i]); }; });
  if (opt.csv) $('[data-csv]', el).onclick = function () { unduhCSV(opt.csv, opt.csvKolom || kolom.filter(function (k) { return typeof k[0] === 'string'; }), data); };
  if (opt.onRender) opt.onRender(el);
}

  } else { // Berita Acara (pengajuan lama sebelum 2.0.1)
    html += '<div class="dua"><div>' + inp('TGL_SURAT', 'Tanggal kunjungan', today(), { type: 'date' }) + '</div><div>' + inp('JUMLAH_TK', 'Jumlah karyawan', '', { type: 'number' }) + '</div></div>' +

  }
  S.isi = null;
  html += '<div class="aksi"><button class="btn" data-tutup>Batal</button><button class="btn utama" id="aLanjut">' + (pre.id ? 'Simpan perubahan' : 'Simpan & lanjut') + '</button></div>';

    var paketAwal = pre.paketId || (pre.data && pre.data.PAKET_ID) || '';
    var isiPaket = function (pertama) {
      var sel = $('#aPaket', bg); if (!sel) return;
      var cvId = $('#aCv', bg).value;
      var list = d.paket.filter(function (p) { return p.CV_ID === cvId && p.Pemenang; });
      sel.innerHTML = '<option value="">— isi manual —</option>' + list.map(function (p) { return '<option value="' + esc(p.ID) + '">' + (p.KodeRUP ? 'RUP ' + esc(p.KodeRUP) + ' · ' : '') + esc(p.NamaPaket) + ' · ' + esc(p.Satker || '') + ' · ' + jt(p.NilaiKontrak || p.Pagu) + '</option>'; }).join('');
      if (pertama && pre.data) { sel.value = paketAwal; return; } // mengubah: isian tersimpan tidak ditimpa
      sel.value = list.some(function (p) { return p.ID === paketAwal; }) ? paketAwal : (list[0] ? list[0].ID : '');

        if ($('#aSim', bg)) $('#aSim', bg).onclick = function (e) { e.preventDefault(); formSimulasi(h.nilai); };
      };
      $('[data-k=NILAI]', bg).addEventListener('input', iuran);
      $('#aPaket', bg).onchange = function () {
        var p = d.paket.filter(function (x) { return x.ID === $('#aPaket', bg).value; })[0]; if (!p) return;
        $('[data-k=NAMA_PROYEK]', bg).value = p.NamaPaket || ''; $('[data-k=PEMILIK_PROYEK]', bg).value = p.Satker || ''; $('[data-k=NILAI]', bg).value = p.NilaiKontrak || p.Pagu || '';
        if (p.Lokasi && !$('[data-k=LOKASI]', bg).value) $('[data-k=LOKASI]', bg).value = p.Lokasi;
        iuran();
      };
      $('#aCv', bg).onchange = function () {
        var c = d.cv.filter(function (x) { return x.ID === $('#aCv', bg).value; })[0] || {};
        $('[data-k=NPP]', bg).value = c.NPP || '';
        if (c.PelaksanaNama) { $('[data-k=NAMA_PJ]', bg).value = c.PelaksanaNama; $('[data-k=HP_PJ]', bg).value = c.PelaksanaHP || ''; }
        isiPaket();
      };

    }
    $('#aLanjut', bg).onclick = function () {
      var r = ambilData(bg), data = r.data, kurang = r.kurang;
      if ($('#aPaket', bg)) data.PAKET_ID = $('#aPaket', bg).value;
      if ($$('.mk', bg).length) data.MAKSUD = $$('.mk:checked', bg).map(function (c) { return +c.value; });
      if (kurang.length) return toast('Lengkapi: ' + kurang.join(', '), true);
      kirimDraf(this, bg, jenis, $('#aCv', bg).value, data, pre.id);
    };
  });
}

function kirimDraf(btn, bg, jenis, cvId, data, idUbah) {
  var janji = idUbah ? call('ubahPengajuan', { id: idUbah, cvId: cvId, data: data }) : call('buatPengajuan', { jenis: jenis, cvId: cvId, data: data });
  busy(btn, janji, 'Menyimpan…').then(function (r) {
    bg.remove();
    S.draf = S.draf || {}; S.draf[r.id] = { data: data, cvId: cvId };
    toast(idUbah ? 'Perubahan tersimpan' : 'Tersimpan sebagai draf. Lanjut unggah berkas.');
    // 2.0.4: server mengirim balik pengajuannya → langkah unggah langsung tampil; data lain disegarkan di belakang layar
    if (r.p) {
      S.d.pengajuan = [r.p].concat(S.d.pengajuan.filter(function (x) { return x.ID !== r.id; }));
      langkahBerkas(r.p);
      muatUlang(true).catch(function () { });
      return;
    }
    return muatUlang(true).then(function () { var p = S.d.pengajuan.filter(function (x) { return x.ID === r.id; })[0]; if (p) langkahBerkas(p); });
  }).catch(function () { });
}

/** 2.0.1: ubah isian pengajuan Draf / Perlu perbaikan (Formulir 1: daftar pekerja dengan NIK utuh diminta dulu). */
function ubahPengajuan(p) {
  var data = (S.draf && S.draf[p.ID] && S.draf[p.ID].data) || p.Data || {};
  if (p.Jenis !== 'Pendaftaran') return formAjuan(p.Jenis, { id: p.ID, cvId: p.CV_ID, data: data });
  call('pekerja', { id: p.ID }).then(function (l) {
    formFormulir1({ id: p.ID, data: data, kar: l.map(function (k) { return { nama: k.Nama, nik: k.NIK, hp: k.NoHP }; }) });
  }).catch(function () { });
}

/** 2.0.1: hapus pengajuan Draf (dengan konfirmasi). */
function hapusPengajuan(p) {
  modal('<h3>Hapus draf?</h3><p>' + esc(JUDUL_JENIS[p.Jenis] || p.Jenis) + ' · ' + esc(p.NamaPK) + ' (' + esc(p.ID) + ')</p><p class="muted">Isian, daftar pekerja, dan berkas yang sudah diunggah ikut dihapus.</p>' +
    '<div class="aksi"><button class="btn" data-tutup>Batal</button><button class="btn utama bahaya" id="hYa">Ya, hapus</button></div>', function (bg) {
      $('#hYa', bg).onclick = function () {
        busy(this, call('hapusPengajuan', { id: p.ID })).then(function () { bg.remove(); if (S.draf) delete S.draf[p.ID]; toast('Draf dihapus'); return muatUlang(true); }).catch(function () { });
      };
    });
}

/** Langkah 2: unduh dokumen terisi, unggah tiap berkas, kirim. */
function langkahBerkas(p) {
  var jenis = p.Jenis, berkas = p.Berkas || {}, data = p.Data || {}, cek = p.Cek || {};
  var draf = (S.draf && S.draf[p.ID]) || { data: data, cvId: p.CV_ID };
  // 2.0.1: penonaktifan = surat + berita acara (dua dokumen, satu pengajuan)
  var dokList = { Pendaftaran: ['formulir'], Penonaktifan: ['nonaktif', 'ba'], 'Berita Acara': ['ba'] }[jenis] || [];
  var namaDok = { formulir: 'Formulir 1', nonaktif: 'Surat penonaktifan', ba: 'Berita acara' };
  var kar = p.Karyawan || [];
  var bisaUbah = ['Draf', 'Perlu perbaikan'].indexOf(p.Status) >= 0;
  var tanda = function (k) {
    if (cek[k] === 'ganti') return '<span class="chip menunggak">Perlu diganti</span>';
    if (berkas[k]) return '<a class="ok-ic" target="_blank" href="' + esc(berkas[k]) + '">✓ terunggah</a>';
    return '';
  };
  var baris = function (k, label, wajib, terima) {
    return '<div class="berkas' + (cek[k] === 'ganti' ? ' ganti' : '') + '"><div class="nm">' + esc(label) + (wajib ? '' : ' <span class="muted">(opsional)</span>') + '</div><span data-ok="' + k + '">' + tanda(k) + '</span>' +
      (bisaUbah ? '<label class="btn kecil pilih">' + (berkas[k] ? 'Ganti' : 'Pilih berkas') + '<input type="file" accept="' + (terima || 'application/pdf,image/*') + '" data-slot="' + k + '" hidden></label>' : '') + '</div>';
  };
  var no = 1;
  var html = '<h3>' + esc(JUDUL_JENIS[jenis] || jenis) + ' · ' + esc(p.NamaPK) + '</h3><div class="baris">' + chip(p.Status) + '<span class="muted">' + esc(p.ID) + '</span></div>' +
    (p.CatatanOwner ? '<div class="info kuning"><b>Catatan pembina:</b> ' + esc(p.CatatanOwner) + '</div>' : '') +
    (dokList.length ? '<div class="step"><div class="no">' + (no++) + '</div><div><b>Unduh ' + (dokList.length > 1 ? 'dokumen' : namaDok[dokList[0]]) + ' yang sudah terisi</b><div class="muted">Cetak, tanda tangan basah & stempel, lalu pindai atau foto dengan jelas.</div>' +
      dokList.map(function (dk) { return '<div style="margin-top:8px">' + (dokList.length > 1 ? '<div><b>' + namaDok[dk] + '</b></div>' : '') + '<div class="baris" style="margin-top:4px"><button class="btn" data-dok="' + dk + '" data-fmt="pdf">Unduh PDF</button><button class="btn" data-dok="' + dk + '" data-fmt="docx">Unduh Word</button></div></div>'; }).join('') + '</div></div>' : '') +
    '<div class="step"><div class="no">' + (no++) + '</div><div style="flex:1"><b>Unggah berkas</b><div class="muted">PDF, JPG, atau PNG, maks. 5 MB per berkas. Foto otomatis diperkecil.</div>' +
    slotJenis(jenis).map(function (s) { return baris(s[0], LABEL_BERKAS[s[0]] || s[0], s[1]); }).join('') +
    (perluKtp(jenis) ? '<div style="margin-top:10px"><b>KTP pekerja</b> <span class="muted">— satu berkas per orang (foto atau PDF), minimal ' + (S.d.info.minKtp || 2) + ' orang</span></div>' +
      kar.map(function (k) { return baris('ktp_' + k.No, k.No + '. ' + k.Nama + (k.NoHP ? ' (' + k.NoHP + ')' : ''), 1, 'image/*,application/pdf'); }).join('') +
      (bisaUbah ? '<div id="tambahP" style="margin-top:8px"><button class="btn kecil" id="bTambahP">+ Tambah pekerja</button></div>' : '') : '') +
    '</div></div>' +
    '<div class="step"><div class="no">' + (no++) + '</div><div><b>Kirim ke pembina</b><div class="muted">Pembina memeriksa tiap berkas. Status & catatan bisa dipantau di menu Pengajuan saya.</div></div></div>' +
    '<div class="aksi">' + (bisaUbah ? '<button class="btn" id="bUbahIsi">Ubah isian</button>' : '') + (p.Status === 'Draf' ? '<button class="btn bahaya" id="bHapusDraf">Hapus draf</button>' : '') + '<span class="sp"></span><button class="btn" data-tutup>Tutup (lanjut nanti)</button>' + (bisaUbah ? '<button class="btn utama" id="bKirim">Kirim ke pembina</button>' : '') + '</div>';
  modal(html, function (bg) {
    var unduh = function (dok, fmt, btn) {
      var dd = JSON.parse(JSON.stringify(draf.data || {}));
      dd.ID_PENGAJUAN = p.ID;
      // 2.0: daftar pekerja (NIK utuh) diminta saat dokumen dibuat; tidak disimpan di perangkat
      var siap = jenis === 'Pendaftaran' ? call('pekerja', { id: p.ID }).then(function (l) { dd.KARYAWAN = l.map(function (k) { return { nama: k.Nama, hp: k.NoHP, nik: k.NIK }; }); }) : Promise.resolve();
      busy(btn, siap.then(function () { return call('buatDokumen', { jenis: dok, cvId: draf.cvId || p.CV_ID, data: dd, format: fmt }); })).then(unduhBase64).catch(function () { });
    };
    $$('[data-dok]', bg).forEach(function (b) { b.onclick = function () { unduh(b.dataset.dok, b.dataset.fmt, b); }; });
    $$('[data-slot]', bg).forEach(function (inpF) {
      inpF.onchange = function () {
        var f = inpF.files[0]; if (!f) return; var k = inpF.dataset.slot, t = $('[data-ok="' + k + '"]', bg);
        t.innerHTML = '<span class="muted">mengunggah…</span>';
        bacaBerkas(f).then(function (b) { return call('unggahBerkas', { id: p.ID, slot: k, base64: b.base64, mime: b.mime }); })
          .then(function (r) { berkas[k] = r.url; if (cek[k] === 'ganti') cek[k] = 'baru'; t.innerHTML = tanda(k); inpF.closest('.berkas').classList.remove('ganti'); inpF.value = ''; })
          .catch(function (e) { t.innerHTML = tanda(k); toast(e.message, true); });
      };

/* ============================================================
   2.0.3: SIMULASI IURAN JASA KONSTRUKSI (JKK + JKM dari nilai kontrak)
   Tarif berlapis sesuai Permenaker No. 5 Tahun 2021 (sama dengan bpjsketenagakerjaan.go.id/jasa-konstruksi dan E-Jakon):
   tiap lapis nilai kontrak dikali tarifnya, lalu dijumlah. Nilai kontrak yang termasuk PPN dibagi 1,11 dulu (seperti E-Jakon).
   ============================================================ */
var URL_EJAKON = 'https://ejakon.bpjsketenagakerjaan.go.id/';
var TARIF_JAKON = [ // [batas atas lapis, tarif JKK, tarif JKM]
  [100000000, 0.0021, 0.0003], [500000000, 0.0017, 0.0002], [1000000000, 0.0013, 0.0002], [5000000000, 0.0011, 0.0001], [Infinity, 0.0009, 0.0001]];
function hitungIuranJakon(nilai, termasukPpn) {
  var n = Math.max(0, Number(nilai) || 0), dasar = Math.round(termasukPpn ? n / 1.11 : n), bawah = 0, jkk = 0, jkm = 0, lapis = [];
  TARIF_JAKON.forEach(function (t) {
    var porsi = Math.min(dasar, t[0]) - bawah;
    if (porsi > 0) { lapis.push({ dari: bawah, sampai: t[0], porsi: porsi, tJkk: t[1], tJkm: t[2], jkk: porsi * t[1], jkm: porsi * t[2] }); jkk += porsi * t[1]; jkm += porsi * t[2]; }
    bawah = t[0];
  });
  jkk = Math.round(jkk); jkm = Math.round(jkm);
  return { nilai: n, dasar: dasar, jkk: jkk, jkm: jkm, total: jkk + jkm, lapis: lapis };
}
function angkaRp(t) { return Number(String(t || '').replace(/[^\d]/g, '')) || 0; }
function persen(x) { return (x * 100).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + '%'; }
function singkatRp(x) { return x >= 1e9 ? (x / 1e9).toLocaleString('id-ID') + ' M' : (x / 1e6).toLocaleString('id-ID') + ' jt'; }
function labelLapis(l) { return !l.dari ? 's.d. ' + singkatRp(l.sampai) : l.sampai === Infinity ? 'di atas ' + singkatRp(l.dari) : singkatRp(l.dari) + ' – ' + singkatRp(l.sampai); }
function tautanEjakon(teks) { return '<a href="' + URL_EJAKON + '" target="_blank" rel="noopener">' + (teks || 'E-Jakon BPJS Ketenagakerjaan') + ' ↗</a>'; }

function formSimulasi(nilaiAwal) {
  modal('<h3>Simulasi iuran Jasa Konstruksi</h3><p class="muted">Program JKK & JKM dihitung dari nilai kontrak dengan tarif berlapis (Permenaker No. 5 Tahun 2021).</p>' +

    '<label style="display:block;margin-top:8px"><input type="checkbox" id="smPpn" checked> Nilai kontrak sudah termasuk PPN 11% <small class="muted">(dasar hitung = nilai ÷ 1,11)</small></label>' +
    '<div id="smHasil" style="margin-top:12px"></div>' +
    '<p class="muted" style="margin-top:10px">Ini perkiraan. Iuran resmi mengikuti penetapan BPJS Ketenagakerjaan. Hitungan resmi juga ada di ' + tautanEjakon() + '.</p>' +
    '<div class="aksi"><button class="btn" data-tutup>Tutup</button></div>', function (bg) {
      var gambar = function () {
        var h = hitungIuranJakon(angkaRp($('#smNilai', bg).value), $('#smPpn', bg).checked);
        if (!h.nilai) { $('#smHasil', bg).innerHTML = '<div class="kosong">Isi nilai kontrak untuk melihat perkiraan iuran.</div>'; return; }
        $('#smHasil', bg).innerHTML = '<div class="tbl-wrap"><table><thead><tr><th>Program</th><th class="num">Dasar hitung</th><th class="num">Iuran</th></tr></thead><tbody>' +
          '<tr><td>Jaminan Kecelakaan Kerja (JKK)</td><td class="num">' + rp(h.dasar) + '</td><td class="num">' + rp(h.jkk) + '</td></tr>' +

var PETA_UBIN = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';

function meterPerPiksel(lat, z) { return 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, z); }

function proyeksi(lat, lng, z) {
  var n = 256 * Math.pow(2, z), s = Math.sin(Math.max(-85, Math.min(85, lat)) * Math.PI / 180);

  var n = 256 * Math.pow(2, z), m = Math.PI - 2 * Math.PI * y / n;

}

function buatPeta(el, opsi) {

    '<button type="button" class="peta-selesai" data-penuh>✕ Kecilkan peta</button>' +

  function gambar() {

    for (var tx = Math.floor(x0 / 256); tx <= Math.floor((x0 + u.w) / 256); tx++) for (var ty = Math.floor(y0 / 256); ty <= Math.floor((y0 + u.h) / 256); ty++) {

    }).join('') + semua.map(function (t, i) {

  function pusat(lat, lng, z) { if (z) st.z = Math.max(5, Math.min(ZOOM_MAKS, z)); var p = proyeksi(lat, lng, st.z); st.cx = p.x; st.cy = p.y; gambar(); }
  function zoom(dz, px, py) {

    var g = proyeksiBalik(st.cx - u.w / 2 + px, st.cy - u.h / 2 + py, st.z), z = Math.max(5, Math.min(ZOOM_MAKS, st.z + dz));

    st.cy = (Math.min.apply(null, p0.map(function (p) { return p.y; })) + Math.max.apply(null, p0.map(function (p) { return p.y; }))) / 2 - 10;

  var tarik = null, jari = {}, cubit = null;
  var jarak = function () { var k = Object.keys(jari); return Math.hypot(jari[k[0]].x - jari[k[1]].x, jari[k[0]].y - jari[k[1]].y) || 1; };

  el.addEventListener('dblclick', function (e) { if (e.target.closest('.pin, .peta-tombol, .peta-selesai')) return; var r = el.getBoundingClientRect(); zoom(1, e.clientX - r.left, e.clientY - r.top); });

  var api = {

/* ---------------- GPS & foto ---------------- */
/** Ambil titik GPS terbaik dalam ±12 detik (selesai lebih cepat bila ketelitian ≤ 20 m). */
function ambilGps() {
  return new Promise(function (ok, gagal) {
    if (!navigator.geolocation) return gagal(new Error('Perangkat ini tidak mendukung GPS'));
    var terbaik = null, selesai = false, id = null, waktu = null;
    var akhiri = function (galat) {
      if (selesai) return; selesai = true; clearTimeout(waktu); if (id !== null) navigator.geolocation.clearWatch(id);
      if (terbaik) ok(terbaik); else gagal(galat || new Error('Lokasi tidak didapat. Nyalakan GPS/lokasi lalu coba lagi.'));
    };
    id = navigator.geolocation.watchPosition(function (p) {
      var x = { lat: p.coords.latitude, lng: p.coords.longitude, akurasi: Math.max(1, Math.round(p.coords.accuracy)) };
      if (!terbaik || x.akurasi < terbaik.akurasi) terbaik = x;
      if (x.akurasi <= 20) akhiri();
    }, function (e) {
      akhiri(new Error(e && e.code === 1 ? 'Izin lokasi ditolak. Izinkan akses lokasi untuk halaman SIGAP di pengaturan browser, lalu coba lagi.' : 'Lokasi tidak didapat. Nyalakan GPS lalu coba lagi di tempat terbuka.'));
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
    waktu = setTimeout(function () { akhiri(); }, 12000);
  });
}
/** Foto diperkecil di HP (sisi terpanjang 1280 px, JPEG) agar unggah hemat kuota. */
function bacaFoto(file) {
  return new Promise(function (ok, gagal) {
    if (!file || !/^image\//.test(file.type)) return gagal(new Error('Pilih foto (JPG/PNG)'));
    var r = new FileReader();
    r.onerror = function () { gagal(new Error('Gagal membaca foto')); };
    r.onload = function () {
      var img = new Image();
      img.onload = function () {
        var k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok({ base64: c.toDataURL('image/jpeg', 0.8).split(',')[1], mime: 'image/jpeg' });
      };
      img.onerror = function () { gagal(new Error('Foto tidak bisa dibaca. Coba foto ulang.')); };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

/** Titik dari teks Google Maps (sama dengan koordinatDariTeks_ di server): pin tempat, ?q=, @lat,lng, angka, derajat-menit-detik. */
function koordinatDariTeks(t) {
  t = String(t || ''); try { t = decodeURIComponent(t); } catch (e) { /* biarkan */ }
  var m = t.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/) ||
    t.match(/[?&](?:q|query|ll|destination|center|sll)=(?:loc:)?\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/) ||
    t.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/) ||
    (/^\s*-?\d/.test(t) ? t.match(/^\s*(-?\d{1,2}(?:\.\d+)?)\s*[,;\s]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/) : null);
  if (m) return { lat: +m[1], lng: +m[2] };
  var d = t.match(/(\d+)°\s*(\d+)['′]\s*([\d.]+)["″]?\s*([NS])[\s,]+(\d+)°\s*(\d+)['′]\s*([\d.]+)["″]?\s*([EW])/i);
  if (d) {
    var la = +d[1] + d[2] / 60 + d[3] / 3600, lo = +d[5] + d[6] / 60 + d[7] / 3600;
    return { lat: /s/i.test(d[4]) ? -la : la, lng: /w/i.test(d[8]) ? -lo : lo };
  }
  return null;
}

  modal('<h3>Rekam lokasi ' + nama + '</h3><div class="muted">' + esc(kantor ? x.Nama : x.NamaPaket) + '</div>' +
    '<div class="info">' + (owner ? 'Ambil titik GPS saat berada di lokasi, atau <b>ketuk peta</b> untuk memilih / menggeser titik.' :
      'Berdirilah di ' + (kantor ? 'kantor perusahaan' : 'lokasi proyek') + ', nyalakan GPS, lalu ambil titik. Titik akan dicek petugas KC.') + '</div>' +
    '<div id="lkPeta" class="sedang"></div>' +
    '<div class="baris" style="margin-top:8px;flex-wrap:wrap"><button type="button" class="btn utama" id="lkGps">📍 Ambil titik GPS</button><span class="muted" id="lkInfo"></span></div>' +
    (owner ? '<details class="tempel"><summary>Tempel titik dari Google Maps</summary><div class="muted">Di Google Maps: tekan lama titiknya lalu salin angka koordinat, atau <b>Bagikan › Salin link</b>. Tempel di sini.</div>' +
      '<div class="baris"><input type="text" id="lkTempel" placeholder="-7.160520, 113.479130 atau tautan Google Maps"><button type="button" class="btn" id="lkPakai">Pakai</button></div></details>' : '') +
    '<label class="f">Foto ' + (kantor ? 'papan nama / kantor' : 'papan proyek / lokasi proyek') + ' <small>(' + (owner ? 'pilihan' : 'wajib') + ')</small></label>' +
    '<input type="file" id="lkFoto" accept="image/*" capture="environment">' +
    '<label class="f">Catatan <small>(pilihan)</small></label><input type="text" id="lkCat" maxlength="300" placeholder="' + (kantor ? 'mis. lantai 2, sebelah toko bangunan' : 'mis. ruas jalan desa, titik awal pekerjaan') + '">' +
    '<div class="aksi"><button class="btn" data-tutup>Batal</button><button class="btn utama" id="lkSimpan" disabled>Simpan lokasi</button></div>', function (bg) {
      var tampil = function () {
        var kurang = titik && titik.sumber === 'GPS' && titik.akurasi > batas;
        $('#lkInfo', bg).innerHTML = !titik ? '' : titik.sumber === 'GPS' ? 'GPS ±' + titik.akurasi + ' m ' + (kurang ? '— <b style="color:var(--merah)">kurang teliti</b> (batas ' + batas + ' m). Pindah ke tempat terbuka lalu ambil lagi.' +
          '<br><small>Di laptop/PC lokasi hanya perkiraan dari Wi-Fi. Rekam dari HP dengan GPS menyala.</small>' : '✓') : titik.sumber === 'Google Maps' ? 'Titik dari Google Maps ✓' : 'Titik dipilih di peta ✓';
        $('#lkSimpan', bg).disabled = !titik || kurang;
      };
      peta = buatPeta($('#lkPeta', bg), {
        titik: lama ? [{ lat: lama.Lat, lng: lama.Lng, kelas: 'lama', huruf: kantor ? 'K' : 'P', judul: 'Titik sebelumnya' }] : [],
        saatPilih: owner ? function (lat, lng) { titik = { lat: lat, lng: lng, akurasi: '', sumber: 'Peta' }; tampil(); } : null
      });
      $('#lkGps', bg).onclick = function () {
        busy(this, ambilGps(), 'Mencari sinyal GPS…').then(function (g) { titik = { lat: g.lat, lng: g.lng, akurasi: g.akurasi, sumber: 'GPS' }; peta.pilih(g.lat, g.lng, false, g.akurasi); tampil(); }).catch(function () { });
      };
      if ($('#lkPakai', bg)) $('#lkPakai', bg).onclick = function () {
        var t = $('#lkTempel', bg).value.trim(), k = koordinatDariTeks(t);
        if (!t) return toast('Tempel angka koordinat atau tautan Google Maps', true);
        var dapat = k ? Promise.resolve(k) : /^https?:\/\//i.test(t) ? call('bacaTautanPeta', { teks: t }) :
          Promise.reject(new Error('Titik tidak terbaca. Salin angka koordinat dari Google Maps (mis. -7.160520, 113.479130).'));
        busy(this, dapat, 'Membaca…').then(function (g) {
          if (!(g.lat >= -11.5 && g.lat <= 6.5 && g.lng >= 94 && g.lng <= 141.5)) return toast('Titik di luar wilayah Indonesia. Periksa lagi yang ditempel.', true);
          titik = { lat: g.lat, lng: g.lng, akurasi: '', sumber: 'Google Maps' }; peta.pilih(g.lat, g.lng); tampil();
        }).catch(function () { });
      };
      $('#lkSimpan', bg).onclick = function () {
        var f = $('#lkFoto', bg).files[0];
        if (!owner && !f) return toast('Foto ' + (kantor ? 'papan nama / kantor' : 'papan proyek') + ' wajib diisi', true);
        busy(this, (f ? bacaFoto(f) : Promise.resolve(null)).then(function (foto) {
          return call('simpanLokasi', { jenis: jenis, cvId: kantor ? x.ID : '', paketId: kantor ? '' : x.ID, lat: titik.lat, lng: titik.lng, akurasi: titik.akurasi, sumber: titik.sumber, catatan: $('#lkCat', bg).value, foto: foto });
        }), 'Menyimpan…').then(function (r) {
          gantiLokasi(r.lokasi); bg.remove();
          toast(owner ? 'Lokasi tersimpan' : 'Lokasi terkirim. Petugas KC akan mengeceknya.');
          if (selesai) selesai();
        }).catch(function () { });
      };
    });
}

function formCekLokasi(l, selesai) {
  modal('<h3>Cek lokasi ' + (l.Jenis === 'Kantor' ? 'kantor' : 'proyek') + '</h3><div class="muted">' + esc(namaSasaran(l)) + '</div>' + ringkasLokasi(l) +
    '<div id="ckPeta" class="sedang"></div><div class="baris" style="margin-top:6px;flex-wrap:wrap"><a class="btn kecil" target="_blank" rel="noopener" href="' + esc(urlMaps(l)) + '">Buka di Google Maps ↗</a>' +
    (l.FotoURL ? '<a class="btn kecil" target="_blank" rel="noopener" href="' + esc(l.FotoURL) + '">Lihat foto</a>' : '') + '</div>' +
    '<label class="f">Catatan <small>(wajib bila tidak cocok)</small></label><input type="text" id="ckCat" maxlength="300">' +
    '<div class="aksi"><button class="btn" data-tutup>Tutup</button><button class="btn bahaya" id="ckTidak">Tidak cocok</button><button class="btn utama" id="ckCocok">Cocok</button></div>', function (bg) {
      buatPeta($('#ckPeta', bg), { titik: [{ lat: l.Lat, lng: l.Lng, akurasi: +l.Akurasi || 0, kelas: kelasPin(l), huruf: l.Jenis === 'Kantor' ? 'K' : 'P' }] });
      var kirim = function (btn, hasil) {
        busy(btn, call('cekLokasi', { id: l.ID, hasil: hasil, catatan: $('#ckCat', bg).value })).then(function (r) {
          gantiLokasi(r.lokasi); bg.remove(); toast('Lokasi ditandai: ' + (hasil === 'Cocok' ? 'dicek petugas' : 'tidak cocok')); if (selesai) selesai();
        }).catch(function () { });
      };
      $('#ckCocok', bg).onclick = function () { kirim(this, 'Cocok'); };
      $('#ckTidak', bg).onclick = function () { if (!$('#ckCat', bg).value.trim()) return toast('Tulis alasan tidak cocok', true); kirim(this, 'Tidak cocok'); };
    });
}

/* ---------------- tab Peta (petugas & Pengamat) ---------------- */
function bukaSasaranLokasi(l) {
  if (S.me.peran === 'OWNER' && S.me.hak !== 'Lihat' && l.Status === 'Belum dicek') return formCekLokasi(l, function () { if (S.go) S.go(S.tab); });
  if (l.Jenis === 'Kantor') { var c = S.d.cv.filter(function (x) { return x.ID === l.CV_ID; })[0]; if (c && S.me.peran === 'OWNER') return detailCv(c); return; }
  var p = S.d.paket.filter(function (x) { return x.ID === l.PAKET_ID; })[0]; if (p) detailPaket(p);
}
function tabPeta(el) {
  var d = S.d, owner = S.me.peran === 'OWNER', lok = d.lokasi || [];
  var hit = function (f) { return lok.filter(f).length; };
  el.innerHTML = '<h2>Peta lokasi</h2><p class="muted">' + (owner ? 'Kantor CV/PT (K) dan lokasi proyek (P). Kuning = belum dicek, hijau = dicek petugas, merah = tidak cocok. Ketuk titik untuk rincian atau mengecek.' :
    'Lokasi proyek konstruksi yang sudah direkam. Ketuk titik untuk rincian proyek.') + '</p>' + (owner ? '<div class="filters" id="fPeta"></div>' : '') + '<div id="petaSemua" class="besar"></div><div id="lPeta" style="margin-top:12px"></div>';
  var peta = buatPeta($('#petaSemua'), {});
  var gambar = function () {
    var f = S.f.peta || 'Semua';
    var arr = lok.filter(function (l) { return f === 'Semua' || l.Status === f || l.Jenis === f; });
    peta.setTitik(arr.map(function (l) { return { lat: l.Lat, lng: l.Lng, kelas: kelasPin(l), huruf: l.Jenis === 'Kantor' ? 'K' : 'P', judul: namaSasaran(l), klik: function () { bukaSasaranLokasi(l); } }; }));
    peta.cocokkan();
    tabel($('#lPeta'), arr.slice().sort(function (a, b) { return (a.Status === 'Belum dicek' ? 0 : 1) - (b.Status === 'Belum dicek' ? 0 : 1) || String(b.Waktu).localeCompare(String(a.Waktu)); }),
      [[function (r) { return chip(r.Status); }, 'Status']].concat(owner ? [['Jenis', 'Jenis']] : [], [[function (r) { return esc(namaSasaran(r)); }, owner ? 'CV/PT / proyek' : 'Proyek', 'judul-hp'], [function (r) { return esc(r.Waktu || ''); }, 'Direkam']],
        owner ? [[function (r) { return esc(r.OlehNama || ''); }, 'Oleh']] : []),
      { id: 'lk', hp: 1, klik: bukaSasaranLokasi, kosong: 'Belum ada lokasi yang direkam' });
  };
  if (owner) filterChips($('#fPeta'), 'peta', [['Semua', lok.length], ['Belum dicek', hit(function (l) { return l.Status === 'Belum dicek'; })], ['Kantor', hit(function (l) { return l.Jenis === 'Kantor'; })],
    ['Proyek', hit(function (l) { return l.Jenis === 'Proyek'; })], ['Tidak cocok', hit(function (l) { return l.Status === 'Tidak cocok'; })]], gambar);
  gambar();
}

/* === 99-mulai.js === */
/* ----------------------------------------------------------------------
 *  SIGAP Jakon 2.0 · mulai: buka penyimpanan (PIN bila ada) → kode undangan bila belum masuk → tampilkan data
 *  tersimpan lebih dulu (≤ 7 hari), lalu segarkan dari server di belakang layar.
 * ---------------------------------------------------------------------- */
/** Bentuk data awal dari server disamakan untuk semua peran (Pelaksana tanpa pengaturan & akses, Pengamat tanpa pengajuan). */
function siapkanData(d) {
  d.cv = d.cv || []; d.paket = d.paket || []; d.pengajuan = d.pengajuan || []; d.pengguna = d.pengguna || []; d.akses = d.akses || []; d.impor = d.impor || []; d.lokasi = d.lokasi || [];
  d.info = d.info || {};
  S.d = d; S.me = d.me || {};
  return d;
}

async function mulaiSigap() {
  bersihkanVersiLama();
  await muatDb();
  if (SIMPAN.rekTerkunci) {
    var ok = await layarPin();
    if (!ok) return layarMasuk('Data di perangkat ini sudah dihapus. Masuk lagi dengan kode undangan baru dari petugas KC.');
  }
  if (!terdaftar()) return layarMasuk();
  var segar = DB.awal && Date.now() - (DB.sinkron.terakhirOk || 0) < KUNCI_SINKRON_MS;
  if (segar) { siapkanData(DB.awal); tampilPeran(); tandaSegar(DB.awalT); }
  else $('#app').innerHTML = '<div class="loading">' + (DB.awal ? 'Sudah lebih dari ' + HARI_KUNCI + ' hari tidak tersambung. Menyambungkan ke server…' : 'Memuat data…') + '</div>';
  try {
    var d = await call('awal');
    siapkanData(d); simpanCache(d);
    if (segar && !bolehGanti()) { tandaSegar(0, true); return; }
    tampilPeran();
  } catch (e) {
    if (!terdaftar()) return; // dicabut → layar masuk sudah tampil
    if (segar) { tandaSegar(DB.awalT, false, e.message); return; }
    $('#app').innerHTML = kartuGerbang('<div class="info" style="margin-top:14px">' + esc(e.message) + '</div><p class="muted">Data tersimpan tidak ditampilkan karena perangkat ini ' +
      (DB.awal ? 'lebih dari ' + HARI_KUNCI + ' hari tidak tersambung' : 'belum pernah memuat data') + '. Sambungkan internet lalu coba lagi.</p>' +
      '<div style="margin-top:12px"><button class="btn utama" onclick="location.reload()">Coba lagi</button></div>');
  }
}
mulaiSigap();
