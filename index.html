<script>
/* === kit:sandi === */
/* =====================================================================
 *  KitSandi — PIN perangkat bersama LENSA Suite (Tahap 3).
 *  Data di perangkat dikunci dengan PIN: kunci AES-GCM 256 bit diturunkan dari PIN (PBKDF2-SHA256, 250.000 putaran),
 *  isi dimampatkan (gzip) lalu disandikan. Rumus sama dengan PIN LENSA PK 2.x, sehingga semua aplikasi seragam.
 *  PIN tidak pernah disimpan; yang tersimpan hanya garam + isi tersandi. Lupa PIN = data di perangkat harus dihapus
 *  (data di Google Sheet tetap aman), lalu masuk lagi dengan kode undangan.
 * ===================================================================== */
var KitSandi = (function () {
  var ULANG = 250000;
  function keB64(buf) { var u = buf instanceof Uint8Array ? buf : new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i + 8192)); return btoa(s); }
  function dariB64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function pinSah(pin) { return /^\d{4,12}$/.test(String(pin || '')); }
  function garamBaru() { return crypto.getRandomValues(new Uint8Array(16)); }
  async function kunciDariPin(pin, garam) {
    var dasar = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(pin)), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: garam, iterations: ULANG, hash: 'SHA-256' }, dasar, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function mampat(teks) {
    var b = new TextEncoder().encode(teks);
    if (typeof CompressionStream === 'undefined') return { z: 0, b: b };
    var s = new Blob([b]).stream().pipeThrough(new CompressionStream('gzip'));
    return { z: 1, b: new Uint8Array(await new Response(s).arrayBuffer()) };
  }
  async function urai(b, z) {
    if (!z) return new TextDecoder().decode(b);
    var s = new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(s).text();
  }
  /** obj → rekaman tersandi { terkunci, garam, iv, z, isi (ArrayBuffer) }. */
  async function sandikan(obj, kunci, garam) {
    var m = await mampat(JSON.stringify(obj)), iv = crypto.getRandomValues(new Uint8Array(12));
    var isi = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, kunci, m.b);

  function deteksiPemisah(teks) {

    var terbaik = ',', skor = -1;
    [',', ';', '\t', '|'].forEach(function (p) {
      var g = uraiCsv(contoh, p);
      var lebar = g.map(function (r) { return r.length; }).sort(function (a, b) { return b - a; });
      var s = lebar.length ? lebar[Math.floor(lebar.length / 4)] : 0;
      if (s > skor) { skor = s; terbaik = p; }
    });
    return terbaik;
  }

  function aliasSemua() {
    var set = {};
    CFG.jenis.forEach(function (lap) {
      pemetaan(lap).forEach(function (d) {
        d.alias.forEach(function (a) { set[norm(a.replace(/#\d+$/, ''))] = true; });
      });
    });
    delete set[''];
    return set;
  }

  function barisData(row) {
    var adaNpp = false, adaBlth = false, adaTgl = false, adaBulan = false, angka = 0;
    for (var i = 0; i < row.length; i++) {
      var x = String(row[i] || '').trim();
      if (!x) continue;
      if (/^(jan|feb|mar|apr|mei|may|jun|jul|agu|ags|aug|sep|okt|oct|nov|des|dec)$/i.test(x)) adaBulan = true;
      if (keAngka(x) !== null) angka++;
      if (/^[A-Z]{2}\d{6}$/i.test(x)) adaNpp = true;
      else if (/^\d{7,8}$/.test(x) && !/^(19|20)\d{2}(0[1-9]|1[0-2])([0-2]\d|3[01])$/.test(x)) adaNpp = true;
      else if (/^\d{1,2}[\-\/]\d{4}$/.test(x)) adaBlth = true;
      else if (/^\d{1,2}[\-\/]\d{1,2}[\-\/]\d{2,4}$/.test(x)) adaTgl = true;
    }
    return adaNpp || (adaBlth && adaTgl) || (adaBulan && angka >= 8);
  }

  function barisJudulKelompok(row) {
    var isi = row.filter(function (x) { return String(x || '').trim() !== ''; });
    if (isi.length < 2) return false;
    for (var i = 0; i < isi.length; i++) if (String(isi[i]).indexOf(':') >= 0) return false;
    return true;
  }

  function analisaGrid(grid, namaFile) {
    var semua = aliasSemua();
    var terbaik = -1, skorTerbaik = 0;
    var batas = Math.min(grid.length, 80);
    for (var r = 0; r < batas; r++) {
      var skor = 0;
      for (var c = 0; c < grid[r].length; c++) {
        var h = norm(grid[r][c]);
        if (h && semua[h]) skor++;
      }
      if (skor > skorTerbaik) { skorTerbaik = skor; terbaik = r; }
    }
    if (skorTerbaik < 3) {
      // judul kolom tidak dikenali: pakai baris tepat di atas data pertama, lalu andalkan urutan kolom
      terbaik = -2;
      for (var rr = 0; rr < batas; rr++) if (barisData(grid[rr])) { terbaik = rr - 1; break; }
      if (terbaik === -2) throw new Error('Judul kolom laporan tidak ditemukan dan tidak ada baris NPP. Pastikan file adalah hasil ekspor laporan sistem (CSV/XLSX).');
    }

    var mulai = -1;
    for (var r2 = terbaik + 1; r2 < grid.length; r2++) {
      if (barisData(grid[r2])) { mulai = r2; break; }
    }
    if (mulai < 0) throw new Error('Tidak ada baris data (NPP) di bawah judul kolom.');

    var atas = terbaik < 0 ? mulai : terbaik;
    for (var k = 1; k <= 4 && terbaik >= 0 && terbaik - k >= 0; k++) {
      if (barisJudulKelompok(grid[terbaik - k])) atas = terbaik - k;
      else break;
    }
    var lebar = 0;
    for (var r3 = atas; r3 < Math.min(grid.length, mulai + 5); r3++) lebar = Math.max(lebar, grid[r3].length);
    var bagian = [], gabung = [];
    for (var c2 = 0; c2 < lebar; c2++) {
      var p = [];
      for (var r4 = atas; r4 < mulai; r4++) {
        var t = norm(grid[r4][c2]);
        if (t) p.push(t);
      }
      bagian.push(p);
      gabung.push(p.join(' '));
    }
    var dataPertama = grid[mulai], lebarData = 0;
    for (var c3 = 0; c3 < dataPertama.length; c3++) if (String(dataPertama[c3]).trim() !== '') lebarData = c3 + 1;

    // teks di luar tabel (judul atas dan catatan bawah) untuk tanggal cetak, periode, pembina
    var luar = grid.slice(0, atas).map(function (x) { return x.join(' '); });
    for (var r5 = mulai; r5 < grid.length; r5++) {
      if (!barisData(grid[r5])) luar.push(grid[r5].join(' '));
    }
    var an = {
      kepala: terbaik, atas: atas, mulai: mulai, lebar: lebar, lebarData: lebarData,
      bagian: bagian, gabung: gabung, judulTeks: luar.join('\n'), namaFile: namaFile || ''
    };
    an.jenis = tebakJenis(gabung.join(' | '), namaFile);
    return an;
  }

  /** Aturan pengenal jenis laporan. Jenis yang tidak dipakai aplikasi ini: ditolak dengan pesannya (CFG.tolak) atau dilewati. */
  var ATURAN_JUDUL = [
    ['PROYEK_JAKON', function (t) { return /no proyek/.test(t) && /(nilai iuran|tgl awal|masa proyek)/.test(t); }],
    ['LENSA_STATUS', function (t) { return /kontak utama/.test(t) && /(status bayar|segmen)/.test(t); }],
    ['KPI084', function (t) { return /pkbu itw/.test(t) && /menunggak/.test(t); }],
    ['KPI085', function (t) { return /migrasi/.test(t) && /piutang/.test(t) && /pembina/.test(t); }],
    ['ITW_ITB', function (t) { return / koef/.test(t) && / itb /.test(t); }],
    ['ITW_ITB', function (t) { return /kecukupan ibr/.test(t) && /(blm posting|belum posting|penilaian)/.test(t); }],
    ['KARTU_IURAN', function (t) { return /blth iuran/.test(t) && /(tanggal|tgl) bayar/.test(t); }],
    ['IBR', function (t) { return (/jatuh tempo/.test(t) && /dibayar dimuka/.test(t)) || (/kode transaksi/.test(t) && / ijt /.test(t)); }],
    ['MONITORING', function (t) { return /(penambahan|pengurangan)/.test(t) && /aktif/.test(t); }],
    ['DATA_BU', function (t) { return /(nama ilo|kode ilo|rate jkk)/.test(t); }]
  ];
  var ATURAN_FILE = [
    ['KPI084', /kpi\s*_?084/], ['KPI085', /kpi\s*_?085/], ['LENSA_STATUS', /status.?pk/], ['ITW_ITB', /itw|itb/], ['KARTU_IURAN', /kartu/],
    ['MONITORING', /monitor/], ['DATA_BU', /badan.?usaha|dbu|data.?bu/], ['IBR', /ibr|belum.?rinci/], ['PROYEK_JAKON', /proyek.?jakon|jakon.?aktif/]
  ];
  function dipakai(j) { return CFG.jenis.indexOf(j) >= 0; }
  function tebakJenis(teks, namaFile) {
    var t = ' ' + teks + ' ', i;
    for (i = 0; i < ATURAN_JUDUL.length; i++) {
      var a = ATURAN_JUDUL[i];
      if (!a[1](t)) continue;
      if (dipakai(a[0])) return a[0];
      if (CFG.tolak[a[0]]) throw new Error(CFG.tolak[a[0]]);
    }
    var f = String(namaFile || '').toLowerCase();
    for (i = 0; i < ATURAN_FILE.length; i++) if (dipakai(ATURAN_FILE[i][0]) && ATURAN_FILE[i][1].test(f)) return ATURAN_FILE[i][0];
    throw new Error('Jenis laporan tidak dikenali dari judul kolom maupun nama file.');
  }

  function cariKolom(an, alias, dipakai) {
    var m = String(alias).match(/^(.*?)(\*)?(?:#(\d+))?$/);
    var a = norm(m[1]), awalan = !!m[2], ke = m[3] ? +m[3] : 1, berurut = !!m[3];
    if (!a) return -1;
    var cocok = [], c;
    var sama = function (c) { return an.gabung[c] === a || an.bagian[c].indexOf(a) >= 0; };
    var memuat = function (c) { return (' ' + an.gabung[c] + ' ').indexOf(' ' + a + ' ') >= 0; };
    if (awalan) {
      for (c = 0; c < an.lebar; c++) {
        if (an.gabung[c].indexOf(a) === 0 || an.bagian[c].some(function (p) { return p.indexOf(a) === 0; })) cocok.push(c);
      }
      return cocok.length >= ke ? cocok[ke - 1] : -1;
    }
    // #n: kolom ke-n (urut kiri ke kanan) yang judulnya sama atau memuat alias
    if (berurut) {
      for (c = 0; c < an.lebar; c++) if (sama(c) || memuat(c)) cocok.push(c);
      return cocok.length >= ke ? cocok[ke - 1] : -1;
    }
    for (c = 0; c < an.lebar; c++) {
      if (dipakai[c]) continue;
      if (sama(c)) cocok.push(c);
    }
    if (!cocok.length) {
      for (c = 0; c < an.lebar; c++) {
        if (dipakai[c]) continue;
        if (memuat(c)) cocok.push(c);
      }
      cocok.sort(function (x, y) { return x - y; });
    }
    return cocok.length >= ke ? cocok[ke - 1] : -1;
  }

  function cocokTipe(tipe, x) {
    switch (tipe) {
      case 'bulat': return /^-?(\d{1,3}(,\d{3})+|\d+)$/.test(x);
      case 'angka': return keAngka(x) !== null;
      case 'desimal': var a = keAngka(x, true); return a !== null && a < 100;
      case 'digit': return /^[\d\s\-\+\(\)\/]{3,}$/.test(x) || rusakExcel(x);
      case 'ilo': return /^\d{3,5}$/.test(x);
      case 'blth': return !!keBlth(x) && !keTanggal(x) && !/^\d+$/.test(x);
      case 'tgl': return !!keTanggal(x);
      case 'teks': return /[A-Za-z]{2,}/.test(x) && !keBlth(x) && x.indexOf('@') < 0 && !/^(ya|tidak)$/i.test(x);
      case 'email': return x.indexOf('@') > 0;
      case 'npp': return !!rapikanNpp(x);
      case 'div': return /^\d{1,3}$/.test(x);
      case 'kode': return /^[A-Z]\d{2}$/i.test(x);
      case 'pembina': return /^[A-Z]{2}\d{6}/i.test(x) || (/[A-Za-z]{3,}/.test(x) && !keBlth(x));
      case 'yt': return /^(Y|T)$/i.test(x);
      case 'yatidak': return /^(YA|TIDAK|Y|T)$/i.test(x);
      case 'skala': return /^(B|Mn|K|Mi|MI|M)$/.test(x);
      case 'prog': return /^\dP$/i.test(x);
      case 'sipp': return /^(-|sipp|prs|sipp\/prs)$/i.test(x);
      case 'kelas': return !!kelasDariTeks(x);
      case 'noproyek': return /^\d{10,20}$/.test(x);
      case 'kodetender': return /^[A-Za-z0-9][A-Za-z0-9\-\/\.]{1,40}$/.test(x);
      case 'kanal': return /^[A-Za-z][A-Za-z \-]{1,20}$/.test(x);
      case 'sumberdana': return /^[A-Za-z][A-Za-z0-9 \-\.]{1,30}$/.test(x);
      case 'kontak': return /[A-Za-z]{2,}|\d{8,}/.test(x);
    }
    return true;
  }

  function barisContoh(an, grid) {
    var out = [];
    for (var r = an.mulai; r < grid.length && out.length < 150; r++) if (barisData(grid[r])) out.push(grid[r]);
    return out;
  }

  function skorPeta(jenis, peta, contoh) {
    var def = pemetaan(jenis), wajib = {};
    def.forEach(function (d) { if (d.wajib) wajib[d.kolom] = true; });
    var total = 0, ok = true, buruk = [];
    Object.keys(peta).forEach(function (k) {
      var tipe = TIPE_KOLOM[k];
      if (!tipe) return;
      var isi = 0, pas = 0;
      contoh.forEach(function (row) {
        var x = String(row[peta[k]] === undefined ? '' : row[peta[k]]).trim();
        if (!x) return;
        isi++;
        if (cocokTipe(tipe, x)) pas++;
      });
      total += pas - (isi - pas);
      if (wajib[k] && (!isi || pas / isi < 0.8)) { ok = false; buruk.push(k); }
    });
    return { total: total, ok: ok, buruk: buruk };
  }

  function petakanIsi(jenis, contoh) {
    var urut = URUTAN_KOLOM[jenis];
    if (!urut || !contoh.length) return null;
    var lebar = 0;
    contoh.forEach(function (r) { lebar = Math.max(lebar, r.length); });
    var slot = [];
    for (var c = 0; c < lebar; c++) {
      if (contoh.some(function (r) { return String(r[c] === undefined ? '' : r[c]).trim() !== ''; })) slot.push(c);
    }
    var def = pemetaan(jenis), wajib = {};
    def.forEach(function (d) { if (d.wajib) wajib[d.kolom] = true; });
    var nilai = {};
    function skor(i, j) {
      var key = i + '|' + j;
      if (nilai[key] !== undefined) return nilai[key];
      var tipe = TIPE_KOLOM[urut[i]], isi = 0, pas = 0;
      contoh.forEach(function (r) {
        var x = String(r[slot[j]] === undefined ? '' : r[slot[j]]).trim();
        if (!x) return;
        isi++;
        if (!tipe || cocokTipe(tipe, x)) pas++;
      });
      return (nilai[key] = isi ? pas / isi : 0);
    }
    var n = urut.length, m = slot.length, NEG = -1e9;
    var dp = [], dari = [];
    for (var i = 0; i <= n; i++) { dp.push([]); dari.push([]); for (var j = 0; j <= m; j++) { dp[i].push(NEG); dari[i].push(''); } }
    dp[0][0] = 0;
    for (i = 0; i <= n; i++) {
      for (j = 0; j <= m; j++) {
        var v = dp[i][j];
        if (v === NEG) continue;
        if (i < n && j < m) { var a = v + skor(i, j); if (a > dp[i + 1][j + 1]) { dp[i + 1][j + 1] = a; dari[i + 1][j + 1] = 'p'; } }
        if (i < n) { var b = v - (wajib[urut[i]] ? 3 : SERING_KOSONG[urut[i]] ? 0.1 : 0.4); if (b > dp[i + 1][j]) { dp[i + 1][j] = b; dari[i + 1][j] = 'k'; } }
        if (j < m) { var d = v - 0.6; if (d > dp[i][j + 1]) { dp[i][j + 1] = d; dari[i][j + 1] = 's'; } }
      }
    }
    var peta = {};
    i = n; j = m;
    while (i > 0 || j > 0) {
      var arah = dari[i][j];
      if (arah === 'p') { peta[urut[i - 1]] = slot[j - 1]; i--; j--; }
      else if (arah === 'k') i--;
      else j--;
    }
    delete peta.no;
    return peta;
  }

  function petakanKolom(an, grid) {
    var contoh = grid ? barisContoh(an, grid) : [];
    var judul = null, galatJudul = null;
    try { judul = petakanJudul(an); } catch (e) { galatJudul = e; }
    if (!contoh.length || an.jenis === 'KPI084' || !URUTAN_KOLOM[an.jenis]) {
      if (galatJudul) throw galatJudul;
      return judul;
    }
    var sJudul = judul ? skorPeta(an.jenis, judul, contoh) : null;
    var isi = petakanIsi(an.jenis, contoh);
    var sIsi = isi ? skorPeta(an.jenis, isi, contoh) : null;
    if (sJudul && sJudul.ok && (!sIsi || !sIsi.ok || sIsi.total <= sJudul.total * 1.05)) return judul;
    if (sIsi && sIsi.ok) {
      an.posisi = false;
      an.menurutIsi = true;
      return isi;
    }
    if (galatJudul) throw galatJudul;
    throw new Error('Isi kolom tidak sesuai dengan laporan ' + NAMA_LAPORAN[an.jenis] + ' (kolom bermasalah: ' + ((sJudul && sJudul.buruk) || []).join(', ') +
      ').' + (CFG.saranPemetaan ? ' Kirim baris judul kolom file ini ke pengembang, atau sesuaikan tab PEMETAAN.' : ''));
  }

  function petakanJudul(an) {
    var def = pemetaan(an.jenis);
    var peta = {}, dipakai = {};
    def.forEach(function (d) {
      var c = -1;
      for (var i = 0; i < d.alias.length && c < 0; i++) c = cariKolom(an, d.alias[i], dipakai);
      if (c >= 0) { peta[d.kolom] = c; dipakai[c] = true; }
    });
    var kurang = def.filter(function (d) { return d.wajib && peta[d.kolom] === undefined; }).map(function (d) { return d.kolom; });
    if (kurang.length) {
      var urut = URUTAN_KOLOM[an.jenis];
      if (urut && (an.lebarData === urut.length || an.lebar === urut.length)) {
        peta = {};
        urut.forEach(function (k, i) { peta[k] = i; });
        kurang = [];
        an.posisi = true;
      }
    }
    if (kurang.length) {
      var judul = an.gabung.filter(String).join(' | ');
      throw new Error('Kolom wajib tidak ditemukan: ' + kurang.join(', ') + '. Judul kolom di file: ' + judul +
        '.' + (CFG.saranPemetaan ? ' Tambahkan judul yang sesuai di tab PEMETAAN (kolom judul_di_laporan).' : ''));
    }
    return peta;
  }

  /**
   * Baris kelompok "Pembina : AB123456 - NAMA" (laporan se-KC: satu kelompok per pembina, judul kolom berulang)
   * → kode pembina untuk baris-baris di bawahnya. 3C: untuk IBR; 3C.1: untuk semua jenis laporan ber-NPP.
   */
  var POLA_PEMBINA = /pembina\s*:?\s*([A-Z]{2}\d{6})/i;
  // Tahap 7 (Proyek Jakon Aktif): kelompok "Pembina : EJAKON - EJAKON" = proyek dari E-Jakon yang belum dibagi; nama pembina ikut
  var POLA_PEMBINA_PJ = /pembina\s*:?\s*([A-Z]{2}\d{6}|EJAKON)(?:\s*-\s*([A-Za-z][A-Za-z .,'\-]*[A-Za-z]))?/i;
  function ambilBaris(an, peta, grid) {
    var out = [], prev = null, pembinaGrup = '', namaGrup = '', pj = an.jenis === 'PROYEK_JAKON', pola = pj ? POLA_PEMBINA_PJ : POLA_PEMBINA;
    var grupDari = function (m) { pembinaGrup = m[1].toUpperCase(); namaGrup = pj && m[2] ? judulKata(m[2].replace(/\s{2,}.*$/, '')) : ''; };
    for (var r0 = 0; r0 < an.mulai; r0++) { var m0 = (grid[r0] || []).join(' ').match(pola); if (m0) grupDari(m0); }
    for (var r = an.mulai; r < grid.length; r++) {
      var row = grid[r];
      if (peta.npp !== undefined && !rapikanNpp(row[peta.npp])) {
        var mP = row.join(' ').match(pola);
        if (mP) grupDari(mP);
        if (an.jenis === 'IBR') continue; // judul kelompok, judul kolom berulang, jumlah
      }
      var o = {};
      Object.keys(peta).forEach(function (k) {
        var x = row[peta[k]];
        o[k] = x === undefined || x === null ? '' : String(x).trim();
      });
      if (an.jenis === 'KARTU_IURAN') {
        if (!/^\d/.test(o.blth_iuran) || !keBlth(o.blth_iuran)) continue;
        out.push(o);
        continue;
      }
      if (an.jenis === 'KPI084') {
        var bl = norm(o.bulan);
        if (!BULAN_SINGKAT[bl.slice(0, 3)] || !/^[a-z]+$/.test(bl)) continue;
        if (out.some(function (x) { return norm(x.bulan) === bl; })) break; // blok kedua (konsolidasi)
        out.push(o);
        continue;
      }
      var npp = rapikanNpp(o.npp);
      if (pj) {
        // satu baris per No. Proyek; proyek swakelola tanpa NPP tetap diambil
        if (!/^\d{10,20}$/.test(o.no_proyek)) { prev = null; continue; }
        o.npp = npp;
        o.pembina = pembinaGrup; o.pembina_nama = namaGrup;
        out.push(o);
        continue;
      }
      if (npp) {
        o.npp = npp;
        o.div = rapikanDiv(o.div);
        if (!o.pembina && pembinaGrup) o.pembina = pembinaGrup;
        out.push(o);
        prev = o;
        continue;
      }
      var isi = row.filter(function (x) { return String(x || '').trim() !== ''; });
      if (!isi.length) { prev = null; continue; }
      var adaTitikDua = isi.some(function (x) { return String(x).indexOf(':') >= 0 || /^-/.test(String(x).trim()); });
      if (prev && an.jenis === 'DATA_BU' && !adaTitikDua) {
        ['nama', 'nama_ilo', 'alamat', 'pic_nama', 'pic_jabatan'].forEach(function (k) {
          if (o[k]) prev[k] = (prev[k] ? prev[k] + ' ' : '') + o[k];
        });
        if (o.pic_email) prev.pic_email = (prev.pic_email || '') + o.pic_email;
      } else {
        prev = null;
      }
    }
    return out;
  }

  function tentukanPeriode(an) {
    var t = an.judulTeks || '', m, cetak = '';
    m = t.match(/(?:tanggal cetak|tgl\.? cetak|tanggal|tgl)\s*:?\s*(\d{1,2}[\-\/\.]\d{1,2}[\-\/\.]\d{2,4})/i);
    if (m) cetak = keTanggal(m[1]);
    if (!cetak) {
      m = t.match(/periode\s*:?\s*(\d{1,2}[\-\/\. ][a-z]{3}[a-z]*[\-\/\. ]\d{2,4})/i);
      if (m) cetak = keTanggal(m[1]);
    }
    if (!cetak) {
      var f = an.namaFile || '';
      m = f.match(/((?:19|20)\d{2})[\-_\.]?(0[1-9]|1[0-2])[\-_\.]?([0-2]\d|3[01])/);
      if (m) cetak = ymd(m[1], m[2], m[3]);
      else if ((m = f.match(/([0-2]\d|3[01])[\-_\.](0[1-9]|1[0-2])[\-_\.]((?:19|20)\d{2})/))) cetak = ymd(m[3], m[2], m[1]);
      // Tahap 7: unduhan Proyek Jakon Aktif bernama ..._24112026 (ddmmyyyy tanpa pemisah)

/* ----------------------------------------------------------------------
 *  SIGAP Jakon 2.0 · penyimpanan di perangkat (IndexedDB "sigap_jakon", cadangan memori) + PIN pilihan (kit/sandi.js).
 *  Yang disimpan: sambungan perangkat (alamat, idp, token), data awal terakhir (NIK sudah disamarkan server),
 *  galat yang belum terkirim. NIK utuh dan foto KTP TIDAK PERNAH disimpan di perangkat.
 * ---------------------------------------------------------------------- */
var VERSI_APP = '2.4.0'; // 2.4.0: tampilan umum #penonaktifan (tanpa kode akses), penonaktifan disederhanakan, rekonsiliasi paket SIRUP ⇄ Proyek Jakon · 2.3.5: rincian tagihan CV s.d. bulan berjalan (sama dengan LENSA) · 2.3.4: kolom Gudang laporan Proyek Jakon — Menunggu (diambil LENSA ±1 jam) / Tersimpan G… · 2.3.3: istilah Peta → Maps, Peta panas → Heat maps · 2.3.2: denda periode lalu + sisa IBR → total tagihan CV · 2.3.1: total tunggakan (iuran + denda) di CV/PT · 2.3.0 (Tahap 7): Proyek Jakon Aktif + peta panas · 2.2.0 (LENSA Suite 5D): menu nyala/mati per peran dari Pusat Kendali LENSA
var NAMA_DB = 'sigap_jakon', KUNCI_DB = 'state';
var HARI_KUNCI = 7; // seperti aplikasi LENSA Suite lain: 7 hari tidak tersambung → data tersimpan tidak ditampilkan

function dbKosong() {
  return { versi: VERSI_APP, sinkron: { url: '', idp: '', token: '', idKlien: '', akses: null, terakhirOk: 0 }, awal: null, awalT: 0, galatAntre: [] };
}
var DB = dbKosong();
var SIMPAN = { jenis: 'memori', kunci: null, garam: null, rekTerkunci: null, tertunda: null, antre: Promise.resolve() };
var _idb = null;

function bukaIdb() {
  return new Promise(function (ok, gagal) {
    if (typeof indexedDB === 'undefined') return gagal(new Error('IndexedDB tidak tersedia'));
    var req = indexedDB.open(NAMA_DB, 1);
    req.onupgradeneeded = function () { req.result.createObjectStore('kv'); };
    req.onsuccess = function () { ok(req.result); };
    req.onerror = function () { gagal(req.error || new Error('IndexedDB gagal dibuka')); };
  });
}
function idbAmbil() {
  return new Promise(function (ok, gagal) {
    var r = _idb.transaction('kv', 'readonly').objectStore('kv').get(KUNCI_DB);
    r.onsuccess = function () { ok(r.result || null); }; r.onerror = function () { gagal(r.error); };
  });
}
function idbTaruh(isi) {
  return new Promise(function (ok, gagal) {
    var tx = _idb.transaction('kv', 'readwrite');
    if (isi === null) tx.objectStore('kv').delete(KUNCI_DB); else tx.objectStore('kv').put(isi, KUNCI_DB);
    tx.oncomplete = function () { ok(); }; tx.onerror = function () { gagal(tx.error); };
  });
}
function lengkapiDb(d) {
  var k = dbKosong();
  Object.keys(k).forEach(function (x) { if (d[x] === undefined) d[x] = k[x]; });
  Object.keys(k.sinkron).forEach(function (x) { if (d.sinkron[x] === undefined) d.sinkron[x] = k.sinkron[x]; });
  d.versi = VERSI_APP;
  return d;
}
async function muatDb() {
  var data = null;
  try { _idb = await bukaIdb(); data = await idbAmbil(); SIMPAN.jenis = 'idb'; }
  catch (e) { _idb = null; SIMPAN.jenis = 'memori'; }
  if (data && data.terkunci) { SIMPAN.rekTerkunci = data; DB = dbKosong(); return DB; }
  DB = lengkapiDb(data || dbKosong());
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e2) { /* pilihan */ }
  return DB;
}
/** Tulis berurutan; bila PIN terpasang, isi disandikan (AES-GCM dari PIN, rumus sama dengan LENSA PK). */
function tulisDb() {
  SIMPAN.antre = SIMPAN.antre.then(async function () {
    if (!_idb || SIMPAN.rekTerkunci || SIMPAN.dihapus) return;
    var isi = JSON.parse(JSON.stringify(DB));
    if (SIMPAN.kunci) isi = await KitSandi.sandikan(isi, SIMPAN.kunci, SIMPAN.garam);
    await idbTaruh(isi);
  }).catch(function (e) { catatGalat('simpan', e && e.message || e); });
  return SIMPAN.antre;
}
function simpanDb(segera) {
  if (SIMPAN.tertunda) clearTimeout(SIMPAN.tertunda);
  if (segera) return tulisDb();
  SIMPAN.tertunda = setTimeout(tulisDb, 200);
}
/** Hapus semua data SIGAP di perangkat ini (dicabut / keluar / lupa PIN), termasuk sisa versi 1 di localStorage. */
async function hapusDataPerangkat() {
  if (SIMPAN.tertunda) clearTimeout(SIMPAN.tertunda);
  SIMPAN.dihapus = true; // tidak ada tulisan lagi sampai masuk dengan kode undangan baru
  try { await SIMPAN.antre; } catch (e) { /* diam */ }
  DB = dbKosong(); SIMPAN.kunci = null; SIMPAN.garam = null; SIMPAN.rekTerkunci = null;
  try { if (!_idb) _idb = await bukaIdb(); await idbTaruh(null); } catch (e) { /* diam */ }
  bersihkanVersiLama();
}
/** SIGAP 1.x menyimpan token & data awal (termasuk NIK pekerja untuk admin CV) di localStorage: dibuang. */
function bersihkanVersiLama() { try { localStorage.removeItem('sigap_token'); localStorage.removeItem('sigap_awal'); } catch (e) { /* diam */ } }

/* ---------- PIN (pilihan) ---------- */
function pinAktif() { return !!SIMPAN.kunci; }
async function bukaDenganPin(pin) {
  var rek = SIMPAN.rekTerkunci;
  if (!rek) return true;
  var garam = KitSandi.dariB64(rek.garam), k = await KitSandi.kunciDariPin(pin, garam), d;
  try { d = await KitSandi.bukaSandi(rek, k); } catch (e) { return false; }
  SIMPAN.kunci = k; SIMPAN.garam = garam; SIMPAN.rekTerkunci = null;
  DB = lengkapiDb(d);
  return true;
}
async function pasangPin(pin) {
  if (!KitSandi.pinSah(pin)) throw new Error('PIN harus 4–12 angka.');
  SIMPAN.garam = KitSandi.garamBaru();
  SIMPAN.kunci = await KitSandi.kunciDariPin(pin, SIMPAN.garam);
  await simpanDb(true);
}
async function lepasPin() { SIMPAN.kunci = null; SIMPAN.garam = null; await simpanDb(true); }

/* ---------- galat aplikasi → Pusat Kendali LENSA (lewat server SIGAP) ---------- */
function catatGalat(tempat, pesan) {
  try {
    var p = String(pesan || '').replace(/\d{12,}/g, '[angka]').slice(0, 400); // NIK / deret angka panjang tidak pernah dikirim
    if (!p || DB.galatAntre.some(function (g) { return g.pesan === p; })) return;
    DB.galatAntre.push({ waktu: new Date().toISOString().replace('T', ' ').slice(0, 19), tempat: String(tempat || '').slice(0, 100), pesan: p });
    if (DB.galatAntre.length > 20) DB.galatAntre.splice(0, DB.galatAntre.length - 20);
    simpanDb();
  } catch (e) { /* diam */ }
}
window.addEventListener('error', function (e) { catatGalat('halaman', (e && e.message) + (e && e.filename ? ' @ ' + String(e.filename).split('/').pop() + ':' + e.lineno : '')); });
window.addEventListener('unhandledrejection', function (e) { var r = e && e.reason; catatGalat('janji', r && r.message || r); });

/* ----------------------------------------------------------------------
 *  SIGAP Jakon 2.0 · gerbang LENSA Suite: masuk dengan kode undangan dari LENSA PK › Perangkat & pengguna
 *  (awalan "SGJ." = alamat /exec + kode sekali pakai), panggilan ke server dengan idp + token perangkat,
 *  Keluar, dicabut = data di perangkat dihapus, PIN pilihan.
 * ---------------------------------------------------------------------- */
var AWALAN_UNDANGAN = 'SGJ.';
var KUNCI_SINKRON_MS = HARI_KUNCI * 864e5;

function namaPerangkat() {
  var u = navigator.userAgent || '', b = /Edg\//.test(u) ? 'Edge' : /Firefox\//.test(u) ? 'Firefox' : /Chrome\//.test(u) ? 'Chrome' : /Safari\//.test(u) ? 'Safari' : 'Peramban';
  var o = /Android/.test(u) ? 'Android' : /iPhone|iPad/.test(u) ? 'iOS' : /Windows/.test(u) ? 'Windows' : /Mac OS/.test(u) ? 'macOS' : /Linux/.test(u) ? 'Linux' : '';
  return b + (o ? ' · ' + o : '');
}
function idKlien() { if (!DB.sinkron.idKlien) DB.sinkron.idKlien = 'K' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); return DB.sinkron.idKlien; }
function terdaftar() { return !!(DB.sinkron.idp && DB.sinkron.token && DB.sinkron.url); }

/** "SGJ.eyJ1Ijoi…" → { url, kode }. */
function bacaKodeUndangan(teks) {
  var t = String(teks || '').replace(/\s+/g, '');
  if (t.indexOf(AWALAN_UNDANGAN) !== 0) throw new Error('Kode undangan SIGAP diawali "' + AWALAN_UNDANGAN + '". Salin seluruh kode dari pesan undangan.');
  var o;
  try { o = JSON.parse(decodeURIComponent(escape(atob(t.slice(AWALAN_UNDANGAN.length))))); } catch (e) { throw new Error('Kode undangan tidak terbaca. Salin ulang seluruh kode dari pesan undangan.'); }
  if (!o || !/^https:\/\/script\.google\.com\//.test(o.u || '') || !o.c) throw new Error('Kode undangan tidak lengkap.');
  return { url: o.u, kode: o.c };
}

async function kirimKe(url, isi) {
  var r;
  try {
    r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(isi), redirect: 'follow' });
  } catch (e) { throw new Error(navigator.onLine === false ? 'Tidak ada koneksi internet' : 'Gagal menghubungi server: ' + (e && e.message || e)); }
  if (!r.ok) throw new Error('Server menjawab ' + r.status);
  var teks = await r.text();
  try { return JSON.parse(teks); } catch (e) { throw new Error(/<html/i.test(teks) ? 'Alamat server salah, atau deployment SIGAP belum "Siapa saja".' : 'Jawaban server tidak terbaca.'); }
}

/** Panggilan berdata (peran disaring di server). Galat yang tertunda ikut terkirim. */
async function panggilServer(fn, arg) {
  if (!terdaftar()) throw new Error('Perangkat belum masuk.');
  var galat = DB.galatAntre.splice(0);
  var j;
  try {
    j = await kirimKe(DB.sinkron.url, { aksi: 'panggil', idp: DB.sinkron.idp, token: DB.sinkron.token, fn: fn, arg: arg || {}, versiApp: VERSI_APP, perangkat: namaPerangkat(), galat: galat });
  } catch (e) { DB.galatAntre = galat.concat(DB.galatAntre).slice(-20); simpanDb(); throw e; }
  if (!j.ok) {
    if (j.cabut) { await dicabut(j.galat); throw new Error(j.galat); }
    if (galat.length) simpanDb();
    throw new Error(j.galat || 'Gagal');
  }
  var menuLama = teksMenuMati(DB.sinkron.akses);
  if (j.akses) DB.sinkron.akses = j.akses;
  DB.sinkron.terakhirOk = Date.now();
  if (j.akses && typeof periksaMenu === 'function') periksaMenu(menuLama); // 2.2.0 (5D): menu dari Pusat Kendali
  simpanDb();
  return j.data;
}
/** Formulir "Minta akses" (tanpa kode): alamat server dari config.js. */
async function panggilPublik(aksi, arg) {
  var url = window.SIGAP_API || DB.sinkron.url;
  if (!url || /GANTI_DENGAN/.test(url)) throw new Error('Alamat server belum diatur. Minta kode undangan langsung ke petugas KC.');
  var j = await kirimKe(url, { aksi: aksi, arg: arg || {} });
  if (!j.ok) throw new Error(j.error || j.galat || 'Gagal');
  return j.data;
}

async function masukDenganKode(teks) {
  var k = bacaKodeUndangan(teks);
  var j = await kirimKe(k.url, { aksi: 'gabung', kode: k.kode, perangkat: namaPerangkat(), idKlien: idKlien(), versiApp: VERSI_APP });
  if (!j.ok) throw new Error(j.galat || 'Kode undangan ditolak.');
  DB.sinkron.url = k.url; DB.sinkron.idp = j.idp; DB.sinkron.token = j.token; DB.sinkron.akses = j.akses; DB.sinkron.terakhirOk = Date.now();
  DB.awal = null; DB.awalT = 0; SIMPAN.dihapus = false;
  await simpanDb(true);
  return j.akses;
}

/** Akses dicabut / perangkat tidak terdaftar lagi: semua data SIGAP di perangkat ini dihapus. */
async function dicabut(pesan) {

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

function chipCls(s) {
  s = String(s || '').toLowerCase();
  if (s === 'tidak cocok') return 'menunggak'; // 2.1.0 geotag
  if (s === 'dicek petugas') return 'aktif';
  if (s.indexOf('menunggak') >= 0 || s.indexOf('ditolak') >= 0 || s.indexOf('dibatalkan') >= 0) return 'menunggak';
  if (s.indexOf('nonaktif') >= 0) return 'nonaktif';
  if (s.indexOf('belum') >= 0 || s.indexOf('ditunda') >= 0 || s.indexOf('perbaikan') >= 0 || s.indexOf('mirip') >= 0 || s.indexOf('tidak ada') >= 0 || s.indexOf('draf') >= 0) return 'belum';
  if (s.indexOf('checklist') >= 0 || s.indexOf('pembayaran') >= 0 || s.indexOf('diverifikasi') >= 0) return 'checklist';
  if (s.indexOf('berjalan') >= 0 || s.indexOf('diajukan') >= 0) return 'berjalan';
  if (s.indexOf('aktif') >= 0 || s.indexOf('selesai') >= 0 || s === 'cocok' || s === 'manual') return 'aktif';
  return '';
}

/** Jalankan aksi dengan tombol "loading". */

function unduhBase64(r) {
  var bin = atob(r.base64), arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  var url = URL.createObjectURL(new Blob([arr], { type: r.mime }));
  var a = document.createElement('a'); a.href = url; a.download = r.nama; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 4000);
}

function unduhCSV(nama, kolom, rows) {
  var csv = [kolom.map(function (k) { return k[1]; })].concat(rows.map(function (r) { return kolom.map(function (k) { return typeof k[0] === 'function' ? k[0](r) : r[k[0]]; }); }))
    .map(function (r) { return r.map(function (v) { v = String(v == null ? '' : v); return /[",;\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';'); }).join('\n');
  unduhBase64({ base64: btoa(unescape(encodeURIComponent('﻿' + csv))), mime: 'text/csv', nama: nama + '.csv' });
}

/** Baca berkas → base64 (gambar besar diperkecil). */
function bacaBerkas(file) {
  return new Promise(function (ok, gagal) {
    if (!file) return gagal(new Error('Pilih berkas'));
    var tipe = file.type;
    if (!/^(application\/pdf|image\/(jpeg|png|webp))$/.test(tipe) && !/\.(xlsx|xls|csv)$/i.test(file.name)) return gagal(new Error('Format harus PDF, JPG, atau PNG'));
    var r = new FileReader();
    r.onerror = function () { gagal(new Error('Gagal membaca berkas')); };
    r.onload = function () {
      var url = r.result;
      if (/^image\//.test(tipe) && file.size > 900 * 1024) {
        var img = new Image();
        img.onload = function () {
          var maks = 1800, w = img.width, h = img.height, k = Math.min(1, maks / Math.max(w, h));
          var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          ok({ base64: c.toDataURL('image/jpeg', 0.82).split(',')[1], mime: 'image/jpeg', nama: file.name.replace(/\.\w+$/, '.jpg') });
        };
        img.onerror = function () { ok({ base64: url.split(',')[1], mime: tipe, nama: file.name }); };
        img.src = url;
      } else ok({ base64: url.split(',')[1], mime: tipe || 'application/octet-stream', nama: file.name });
    };
    r.readAsDataURL(file);
  });
}

/** Tabel generik dengan pencarian. kolom: [[key|fn, judul, cls]] */
function tabel(el, rows, kolom, opt) {
  opt = opt || {};

  var data = rows.filter(function (r) { return !q || JSON.stringify(r).toLowerCase().indexOf(q) >= 0; });
  var html = '<div class="baris" style="margin-bottom:8px"><input type="text" class="cari" placeholder="Cari…" value="' + esc(S.f[opt.id + '_q'] || '') + '" data-q><span class="muted">' + data.length + ' baris</span><span class="sp"></span>' + (opt.csv ? '<button class="btn kecil" data-csv>Unduh CSV</button>' : '') + (opt.tombol || '') + '</div>';
  if (!data.length) html += '<div class="tbl-wrap"><div class="kosong">' + esc(opt.kosong || 'Belum ada data') + '</div></div>';
  else {
    var batas = opt.batas || 300;
    // 2.0.1: opt.hp → di layar HP tiap baris tampil sebagai kartu (judul kolom di kiri), tidak perlu geser ke samping
    html += '<div class="tbl-wrap' + (opt.hp ? ' hp-kartu' : '') + '"><table><thead><tr>' + kolom.map(function (k) { return '<th>' + esc(k[1]) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      data.slice(0, batas).map(function (r, i) { return '<tr class="' + (opt.klik ? 'klik' : '') + '" data-i="' + i + '">' + kolom.map(function (k) { var v = typeof k[0] === 'function' ? k[0](r) : esc(r[k[0]]); return '<td class="' + (k[2] || '') + '" data-l="' + esc(k[1]) + '">' + v + '</td>'; }).join('') + '</tr>'; }).join('') +
      '</tbody></table>' + (data.length > batas ? '<div class="kosong">Menampilkan ' + batas + ' dari ' + data.length + '. Persempit pencarian.</div>' : '') + '</div>';
  }
  el.innerHTML = html;
  var inp = $('[data-q]', el);
  inp.oninput = function () { S.f[opt.id + '_q'] = inp.value; clearTimeout(inp._t); inp._t = setTimeout(function () { tabel(el, rows, kolom, opt); var n = $('[data-q]', el); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
  if (opt.klik) $$('tr.klik', el).forEach(function (tr) { tr.onclick = function () { opt.klik(data[+tr.dataset.i]); }; });
  if (opt.csv) $('[data-csv]', el).onclick = function () { unduhCSV(opt.csv, opt.csvKolom || kolom.filter(function (k) { return typeof k[0] === 'string'; }), data); };
  if (opt.onRender) opt.onRender(el);
}

/** 2.0.1: status yang dihitung "terealisasi" (proyek sudah jalan). */
var STATUS_REAL = ['Berjalan', 'Sudah checklist', 'Pembayaran BPJSTK', 'Selesai'];
var FILTER_KHUSUS = { 'Belum ada pemenang': function (p) { return !p.Pemenang; }, 'Ada pemenang': function (p) { return !!p.Pemenang; }, 'Terealisasi': function (p) { return STATUS_REAL.indexOf(p.StatusPemkab) >= 0; } };

/** Buka tab Proyek dengan satu saringan (dari kartu/satker di Rekap). */
function bukaProyekPemkab(f) {
  S.f.ppSt = f.status || 'Semua'; S.f.ppSat = f.satker || ''; S.f.ppKhusus = f.khusus || ''; S.f.pp_q = '';
  S.go('proyek');
}

function pemkabRekap(el) {
  var d = S.d, pk = d.paket, st = hitung(pk, function (p) { return p.StatusPemkab || 'Belum dimulai'; });
  var berp = pk.filter(function (p) { return p.Pemenang; });
  var real = pk.filter(FILTER_KHUSUS.Terealisasi);
  var nilai = function (arr) { return arr.reduce(function (s, p) { return s + (Number(p.NilaiKontrak) || Number(p.Pagu) || 0); }, 0); };
  var pct = berp.length ? Math.round(real.length / berp.length * 100) : 0;
  var cvSt = hitung(d.cv, function (c) { return c.Status; });
  var satker = {};
  pk.forEach(function (p) {
    var k = p.Satker || '(tanpa satker)', x = satker[k] = satker[k] || { n: 0, nilai: 0, real: 0, tunda: 0, checklist: 0, bayar: 0 };
    x.n++; x.nilai += Number(p.NilaiKontrak) || Number(p.Pagu) || 0;
    if (STATUS_REAL.indexOf(p.StatusPemkab) >= 0) x.real++;
    if (p.StatusPemkab === 'Ditunda') x.tunda++;
    if (p.StatusPemkab === 'Sudah checklist') x.checklist++;
    if (p.StatusPemkab === 'Pembayaran BPJSTK') x.bayar++;
  });
  var kpi = function (n, l, cls, go, sub) { return '<div class="kpi klik ' + (cls || '') + '" data-go="' + esc(go) + '" title="Klik untuk melihat daftarnya"><div class="n">' + n + '</div><div class="l">' + esc(l) + (sub ? '<br>' + esc(sub) : '') + '</div></div>'; };
  el.innerHTML = '<h2>Rekap proyek konstruksi ' + esc(d.info.tahun || '') + '</h2><p class="muted" style="margin-top:-6px">Klik kartu atau nama satker untuk melihat daftar proyeknya.</p>' +
    '<div class="grid">' + kpi(pk.length, 'Paket konstruksi', '', 'semua', jt(nilai(pk))) + kpi(pk.length - berp.length, 'Rencana, belum ada pemenang', '', 'k:Belum ada pemenang') + kpi(berp.length, 'Sudah ada pemenang', 'biru', 'k:Ada pemenang') +
      kpi(real.length, 'Terealisasi', 'hijau', 'k:Terealisasi', pct + '% dari yang berpemenang') + kpi(st['Sudah checklist'] || 0, 'Sudah checklist', 'hijau', 's:Sudah checklist') + kpi(st['Pembayaran BPJSTK'] || 0, 'Pembayaran BPJSTK', 'hijau', 's:Pembayaran BPJSTK') +
      kpi(st['Ditunda'] || 0, 'Ditunda', 'oranye', 's:Ditunda') + kpi(st['Dibatalkan'] || 0, 'Dibatalkan', 'merah', 's:Dibatalkan') + '</div>' +
    '<div class="kartu" style="margin-top:12px"><b>Realisasi dari paket berpemenang</b><div class="bar" style="margin-top:8px"><i style="width:' + pct + '%"></i></div><div class="muted" style="margin-top:4px">' + real.length + ' dari ' + berp.length + ' paket</div></div>' +
    '<h3>Status kepesertaan CV pemenang</h3><div class="grid">' + STATUS_CV.map(function (s) { return kpi(cvSt[s] || 0, s, s === 'Terdaftar aktif' ? 'hijau' : s === 'Menunggak' ? 'merah' : s === 'Nonaktif' ? '' : 'oranye', 'cv:' + s); }).join('') + '</div>' +
    '<h3>Per satuan kerja</h3><div id="tSat"></div><h3>Proyek ditunda</h3><div id="tTunda"></div>';
  $$('[data-go]', el).forEach(function (k) {
    k.onclick = function () {
      var g = k.dataset.go, v = g.slice(2);
      if (g === 'semua') return bukaProyekPemkab({});
      if (g.indexOf('k:') === 0) return bukaProyekPemkab({ khusus: v });
      if (g.indexOf('s:') === 0) return bukaProyekPemkab({ status: v });

    };
  });

  tabel($('#tSat'), rowsSat, [['Satker', 'Satuan kerja', 'judul-hp'], ['Paket', 'Paket', 'num'], [function (r) { return jt(r.Nilai); }, 'Nilai', 'num'], ['Realisasi', 'Terealisasi', 'num'], ['Checklist', 'Sudah checklist', 'num'], ['Bayar', 'Pembayaran BPJSTK', 'num'], ['Ditunda', 'Ditunda', 'num']],

      klik: function (r) { bukaProyekPemkab({ satker: r.Satker }); } });
  tabel($('#tTunda'), pk.filter(function (p) { return p.StatusPemkab === 'Ditunda'; }).sort(function (a, b) { return String(a.PerkiraanRealisasi).localeCompare(b.PerkiraanRealisasi); }),

}

    }).join('') + '<button type="button" class="btn kecil" data-tambah>+ Tambah pekerja</button><div class="muted" style="margin-top:6px">Minimal ' + (S.d.info.minKtp || 2) + ' pekerja. KTP tiap orang diunggah di langkah berikutnya (foto atau PDF).</div>';
    $$('[data-kn]', w).forEach(function (x) { x.oninput = function () { kar[+x.dataset.kn].nama = x.value; }; });
    $$('[data-kh]', w).forEach(function (x) { x.oninput = function () { kar[+x.dataset.kh].hp = x.value; }; });
    $$('[data-kk]', w).forEach(function (x) { x.oninput = function () { kar[+x.dataset.kk].nik = x.value; }; });
    $$('[data-hapus]', w).forEach(function (x) { x.onclick = function () { kar.splice(+x.dataset.hapus, 1); render(); }; });
    $('[data-tambah]', w).onclick = function () { kar.push({}); render(); };
  };
  while (kar.length < (S.d.info.minKtp || 2)) kar.push({});
  render();
  return function () {
    var isi = kar.filter(function (k) { return String(k.nama || '').trim(); });

  };
}

      };

function kirimDraf(btn, bg, jenis, cvId, data, idUbah) {
  var janji = idUbah ? call('ubahPengajuan', { id: idUbah, cvId: cvId, data: data }) : call('buatPengajuan', { jenis: jenis, cvId: cvId, data: data });
  busy(btn, janji, 'Menyimpan…').then(function (r) {
    bg.remove();
    S.draf = S.draf || {}; S.draf[r.id] = { data: data, cvId: cvId };
    toast(idUbah ? 'Perubahan tersimpan' : 'Tersimpan sebagai draf. Lanjut unggah berkas.');
    // 2.0.4: server mengirim balik pengajuannya → langkah unggah langsung tampil; data lain disegarkan di belakang layar
    if (r.p) {
      S.d.pengajuan = [r.p].concat(S.d.pengajuan.filter(function (x) { return x.ID !== r.id; }));
      langkahBerkas(r.p);
      muatUlang(true).catch(function () { });
      return;
    }
    return muatUlang(true).then(function () { var p = S.d.pengajuan.filter(function (x) { return x.ID === r.id; })[0]; if (p) langkahBerkas(p); });
  }).catch(function () { });
}

/** 2.0.1: ubah isian pengajuan Draf / Perlu perbaikan (Formulir 1: daftar pekerja dengan NIK utuh diminta dulu). */
function ubahPengajuan(p) {
  var data = (S.draf && S.draf[p.ID] && S.draf[p.ID].data) || p.Data || {};
  if (p.Jenis !== 'Pendaftaran') return formAjuan(p.Jenis, { id: p.ID, cvId: p.CV_ID, data: data });
  call('pekerja', { id: p.ID }).then(function (l) {
    formFormulir1({ id: p.ID, data: data, kar: l.map(function (k) { return { nama: k.Nama, nik: k.NIK, hp: k.NoHP }; }) });
  }).catch(function () { });
}

/** 2.0.1: hapus pengajuan Draf (dengan konfirmasi). */
function hapusPengajuan(p) {
  modal('<h3>Hapus draf?</h3><p>' + esc(JUDUL_JENIS[p.Jenis] || p.Jenis) + ' · ' + esc(p.NamaPK) + ' (' + esc(p.ID) + ')</p><p class="muted">Isian, daftar pekerja, dan berkas yang sudah diunggah ikut dihapus.</p>' +

      $('#hYa', bg).onclick = function () {
        busy(this, call('hapusPengajuan', { id: p.ID })).then(function () { bg.remove(); if (S.draf) delete S.draf[p.ID]; toast('Draf dihapus'); return muatUlang(true); }).catch(function () { });
      };
    });
}

/** Langkah 2: unduh dokumen terisi, unggah tiap berkas, kirim. */
function langkahBerkas(p) {
  var jenis = p.Jenis, berkas = p.Berkas || {}, data = p.Data || {}, cek = p.Cek || {};
  var draf = (S.draf && S.draf[p.ID]) || { data: data, cvId: p.CV_ID };
  // 2.0.1: penonaktifan = surat + berita acara (dua dokumen, satu pengajuan)
  var dokList = { Pendaftaran: ['formulir'], Penonaktifan: ['nonaktif', 'ba'], 'Berita Acara': ['ba'] }[jenis] || [];
  var namaDok = { formulir: 'Formulir 1', nonaktif: 'Surat penonaktifan', ba: 'Berita acara' };
  var kar = p.Karyawan || [];
  var bisaUbah = ['Draf', 'Perlu perbaikan'].indexOf(p.Status) >= 0;
  var tanda = function (k) {
    if (cek[k] === 'ganti') return '<span class="chip menunggak">Perlu diganti</span>';
    if (berkas[k]) return '<a class="ok-ic" target="_blank" href="' + esc(berkas[k]) + '">✓ terunggah</a>';
    return '';
  };
  var baris = function (k, label, wajib, terima) {
    return '<div class="berkas' + (cek[k] === 'ganti' ? ' ganti' : '') + '"><div class="nm">' + esc(label) + (wajib ? '' : ' <span class="muted">(opsional)</span>') + '</div><span data-ok="' + k + '">' + tanda(k) + '</span>' +
      (bisaUbah ? '<label class="btn kecil pilih">' + (berkas[k] ? 'Ganti' : 'Pilih berkas') + '<input type="file" accept="' + (terima || 'application/pdf,image/*') + '" data-slot="' + k + '" hidden></label>' : '') + '</div>';
  };
  var no = 1;
  var html = '<h3>' + esc(JUDUL_JENIS[jenis] || jenis) + ' · ' + esc(p.NamaPK) + '</h3><div class="baris">' + chip(p.Status) + '<span class="muted">' + esc(p.ID) + '</span></div>' +
    (p.CatatanOwner ? '<div class="info kuning"><b>Catatan pembina:</b> ' + esc(p.CatatanOwner) + '</div>' : '') +
    (dokList.length ? '<div class="step"><div class="no">' + (no++) + '</div><div><b>Unduh ' + (dokList.length > 1 ? 'dokumen' : namaDok[dokList[0]]) + ' yang sudah terisi</b><div class="muted">Cetak, tanda tangan basah & stempel, lalu pindai atau foto dengan jelas.</div>' +
      dokList.map(function (dk) { return '<div style="margin-top:8px">' + (dokList.length > 1 ? '<div><b>' + namaDok[dk] + '</b></div>' : '') + '<div class="baris" style="margin-top:4px"><button class="btn" data-dok="' + dk + '" data-fmt="pdf">Unduh PDF</button><button class="btn" data-dok="' + dk + '" data-fmt="docx">Unduh Word</button></div></div>'; }).join('') + '</div></div>' : '') +
    '<div class="step"><div class="no">' + (no++) + '</div><div style="flex:1"><b>Unggah berkas</b><div class="muted">PDF, JPG, atau PNG, maks. 5 MB per berkas. Foto otomatis diperkecil.</div>' +
    slotJenis(jenis).map(function (s) { return baris(s[0], LABEL_BERKAS[s[0]] || s[0], s[1]); }).join('') +
    (perluKtp(jenis) ? '<div style="margin-top:10px"><b>KTP pekerja</b> <span class="muted">— satu berkas per orang (foto atau PDF), minimal ' + (S.d.info.minKtp || 2) + ' orang</span></div>' +
      kar.map(function (k) { return baris('ktp_' + k.No, k.No + '. ' + k.Nama + (k.NoHP ? ' (' + k.NoHP + ')' : ''), 1, 'image/*,application/pdf'); }).join('') +
      (bisaUbah ? '<div id="tambahP" style="margin-top:8px"><button class="btn kecil" id="bTambahP">+ Tambah pekerja</button></div>' : '') : '') +
    '</div></div>' +
    '<div class="step"><div class="no">' + (no++) + '</div><div><b>Kirim ke pembina</b><div class="muted">Pembina memeriksa tiap berkas. Status & catatan bisa dipantau di menu Pengajuan saya.</div></div></div>' +
    '<div class="aksi">' + (bisaUbah ? '<button class="btn" id="bUbahIsi">Ubah isian</button>' : '') + (p.Status === 'Draf' ? '<button class="btn bahaya" id="bHapusDraf">Hapus draf</button>' : '') + '<span class="sp"></span><button class="btn" data-tutup>Tutup (lanjut nanti)</button>' + (bisaUbah ? '<button class="btn utama" id="bKirim">Kirim ke pembina</button>' : '') + '</div>';
  modal(html, function (bg) {
    var unduh = function (dok, fmt, btn) {
      var dd = JSON.parse(JSON.stringify(draf.data || {}));
      dd.ID_PENGAJUAN = p.ID;
      // 2.0: daftar pekerja (NIK utuh) diminta saat dokumen dibuat; tidak disimpan di perangkat
      var siap = jenis === 'Pendaftaran' ? call('pekerja', { id: p.ID }).then(function (l) { dd.KARYAWAN = l.map(function (k) { return { nama: k.Nama, hp: k.NoHP, nik: k.NIK }; }); }) : Promise.resolve();
      busy(btn, siap.then(function () { return call('buatDokumen', { jenis: dok, cvId: draf.cvId || p.CV_ID, data: dd, format: fmt }); })).then(unduhBase64).catch(function () { });
    };
    $$('[data-dok]', bg).forEach(function (b) { b.onclick = function () { unduh(b.dataset.dok, b.dataset.fmt, b); }; });
    $$('[data-slot]', bg).forEach(function (inpF) {
      inpF.onchange = function () {
        var f = inpF.files[0]; if (!f) return; var k = inpF.dataset.slot, t = $('[data-ok="' + k + '"]', bg);
        t.innerHTML = '<span class="muted">mengunggah…</span>';
        bacaBerkas(f).then(function (b) { return call('unggahBerkas', { id: p.ID, slot: k, base64: b.base64, mime: b.mime }); })
          .then(function (r) { berkas[k] = r.url; if (cek[k] === 'ganti') cek[k] = 'baru'; t.innerHTML = tanda(k); inpF.closest('.berkas').classList.remove('ganti'); inpF.value = ''; })
          .catch(function (e) { t.innerHTML = tanda(k); toast(e.message, true); });
      };
    });
    if ($('#bTambahP', bg)) $('#bTambahP', bg).onclick = function () {
      $('#tambahP', bg).innerHTML = '<div class="kartu" style="padding:10px"><div class="dua"><div><label class="f">Nama sesuai KTP</label><input type="text" id="tpN"></div><div><label class="f">Nomor HP' + (jenis === 'Pendaftaran' ? '' : ' <small>(opsional)</small>') + '</label><input type="tel" id="tpH"></div></div><div class="aksi"><button class="btn utama kecil" id="tpS">Tambahkan</button></div></div>';
      $('#tpS', bg).onclick = function () {
        busy(this, call('tambahPekerja', { id: p.ID, nama: $('#tpN', bg).value, hp: $('#tpH', bg).value })).then(function () {
          bg.remove(); return muatUlang(true).then(function () { var q = S.d.pengajuan.filter(function (x) { return x.ID === p.ID; })[0]; if (q) langkahBerkas(q); });
        }).catch(function () { });
      };
    };
    if ($('#bUbahIsi', bg)) $('#bUbahIsi', bg).onclick = function () { bg.remove(); ubahPengajuan(p); };
    if ($('#bHapusDraf', bg)) $('#bHapusDraf', bg).onclick = function () { bg.remove(); hapusPengajuan(p); };
    if ($('#bKirim', bg)) $('#bKirim', bg).onclick = function () {
      busy(this, call('kirimPengajuan', { id: p.ID })).then(function () { bg.remove(); toast('Pengajuan terkirim. Terima kasih!'); return muatUlang(true).then(function () { S.go('riwayat'); }); }).catch(function () { });
    };
  });
}

/* ============================================================
   OWNER — verifikasi pengajuan per berkas

/** 2.0.1: KTP pekerja proyek ditagih pembina lewat WA ke penanggung jawab. */
function pesanPj(p, data) {
  return 'Halo ' + (data.NAMA_PJ || '') + ' 👋\nKami dari BPJS Ketenagakerjaan KC Pamekasan terkait pendaftaran proyek "' + (data.NAMA_PROYEK || '') + '" (' + p.NamaPK + ', ' + p.ID + ').\n\n' +
    'Mohon kirimkan foto KTP pekerja proyek lewat WhatsApp ini agar perlindungan Jasa Konstruksi bisa segera kami proses. Terima kasih 🙏';
}
function namaPengaju(p) {
  if (p.UserID === 'UMUM') return 'Umum · ' + ((p.Data && p.Data.PEMOHON) || 'pemohon'); // 2.4.0: tampilan umum tanpa kode
  var u = S.d.pengguna.filter(function (x) { return x.ID === p.UserID; })[0]; return u ? u.Nama : String(p.UserID || '').replace(/^U:/, '');
}
function detailPengajuan(p) {
  var u = S.d.pengguna.filter(function (x) { return x.ID === p.UserID; })[0] || { Nama: namaPengaju(p), NoHP: p.UserID === 'UMUM' ? ((p.Data && p.Data.HP_PEMOHON) || '') : '' };
  var data = p.Data || {}, berkas = p.Berkas || {}, cek = JSON.parse(JSON.stringify(p.Cek || {}));
  var kar = p.Karyawan || [];
  var proyek = p.Jenis === 'Daftarkan Proyek' || p.Jenis === 'Lapor Proyek';
  // cek otomatis untuk proyek
  var auto = '';
  if (proyek && data.PAKET_ID) {
    var pk = S.d.paket.filter(function (x) { return x.ID === data.PAKET_ID; })[0];
    if (pk) {

/* ======================================================================
 *  SIGAP Jakon 2.1 · GEOTAG (LENSA Suite Tahap 4C, keputusan 21 Nov 2026)
 *  - Titik lokasi kantor CV/PT & lokasi proyek.
 *  - Mitra: GPS di tempat + wajib 1 foto → "Belum dicek".
 *  - Petugas (Pemilik/Pelaksana): GPS atau pilih/geser di peta, foto pilihan → "Dicek petugas"; mengecek titik Mitra.
 *  - Pengamat: hanya lokasi proyek (tanpa foto & catatan).
 *  - Peta ringan buatan sendiri di atas ubin OpenStreetMap + tautan Google Maps per titik.
 *  - 2.1.1: layar penuh, cubit/gulir untuk zoom (s.d. 19), lingkaran ketelitian GPS, petugas boleh menempel titik dari Google Maps.
 * ====================================================================== */
var PETA_UBIN = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
var PUSAT_KC = { lat: -7.1568, lng: 113.4746 }; // Pamekasan
var ZOOM_MAKS = 19;
function meterPerPiksel(lat, z) { return 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, z); }

function proyeksi(lat, lng, z) {
  var n = 256 * Math.pow(2, z), s = Math.sin(Math.max(-85, Math.min(85, lat)) * Math.PI / 180);
  return { x: (lng + 180) / 360 * n, y: (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n };
}
function proyeksiBalik(x, y, z) {
  var n = 256 * Math.pow(2, z), m = Math.PI - 2 * Math.PI * y / n;
  return { lat: 180 / Math.PI * Math.atan(0.5 * (Math.exp(m) - Math.exp(-m))), lng: x / n * 360 - 180 };
}

/**
 * Peta ringan. opsi: { titik: [{lat,lng,kelas,huruf,judul,klik}], saatPilih: fn(lat,lng) — ketuk peta untuk memilih titik }.
 * Hasil: { setTitik(arr), pusat(lat,lng,z), pilih(lat,lng), cocokkan(), gambar() }
 */
function buatPeta(el, opsi) {
  opsi = opsi || {};
  var st = { z: 12, cx: 0, cy: 0, titik: opsi.titik || [], pilih: null };
  el.classList.add('peta-wadah');
  el.innerHTML = '<div class="peta-geser"><div class="peta-ubin"></div><div class="peta-titik"></div></div>' +
    '<div class="peta-tombol"><button type="button" data-penuh aria-label="Layar penuh" title="Layar penuh">⛶</button><button type="button" data-z="1" aria-label="Perbesar">+</button><button type="button" data-z="-1" aria-label="Perkecil">−</button></div>' +
    '<button type="button" class="peta-selesai" data-penuh>✕ Kecilkan maps</button>' +
    '<div class="peta-hak">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div>';
  var geser = el.querySelector('.peta-geser'), ubin = el.querySelector('.peta-ubin'), lap = el.querySelector('.peta-titik');
  var ukuran = function () { return { w: el.clientWidth || 300, h: el.clientHeight || 240 }; };
  function gambar() {
    var u = ukuran(), z = st.z, n = Math.pow(2, z), x0 = st.cx - u.w / 2, y0 = st.cy - u.h / 2, html = '';
    for (var tx = Math.floor(x0 / 256); tx <= Math.floor((x0 + u.w) / 256); tx++) for (var ty = Math.floor(y0 / 256); ty <= Math.floor((y0 + u.h) / 256); ty++) {
      if (ty < 0 || ty >= n) continue;
      html += '<img alt="" draggable="false" referrerpolicy="strict-origin-when-cross-origin" src="' + PETA_UBIN.replace('{z}', z).replace('{x}', ((tx % n) + n) % n).replace('{y}', ty) +
        '" style="left:' + Math.round(tx * 256 - x0) + 'px;top:' + Math.round(ty * 256 - y0) + 'px">';
    }
    ubin.innerHTML = html;
    var semua = st.titik.concat(st.pilih ? [st.pilih] : []);
    lap.innerHTML = semua.map(function (t) {
      if (!(t.akurasi > 0)) return '';
      var p = proyeksi(t.lat, t.lng, z), r = Math.max(6, t.akurasi / meterPerPiksel(t.lat, z));
      return r > 4000 ? '' : '<div class="peta-akurasi" style="left:' + Math.round(p.x - x0 - r) + 'px;top:' + Math.round(p.y - y0 - r) + 'px;width:' + Math.round(2 * r) + 'px;height:' + Math.round(2 * r) + 'px"></div>';
    }).join('') + semua.map(function (t, i) {
      var p = proyeksi(t.lat, t.lng, z);
      return '<button type="button" class="pin ' + (t.kelas || '') + '" data-i="' + i + '" title="' + esc(t.judul || '') + '" style="left:' + Math.round(p.x - x0) + 'px;top:' + Math.round(p.y - y0) + 'px"><span></span><b>' + esc(t.huruf || '') + '</b></button>';
    }).join('');
    $$('.pin', lap).forEach(function (b) { var t = semua[+b.dataset.i]; b.onclick = function (e) { e.stopPropagation(); if (t && t.klik) t.klik(); }; });
    geser.style.transform = '';
  }

  function zoom(dz, px, py) {

    var g = proyeksiBalik(st.cx - u.w / 2 + px, st.cy - u.h / 2 + py, st.z), z = Math.max(5, Math.min(ZOOM_MAKS, st.z + dz));

    if (t.length === 1) return pusat(t[0].lat, t[0].lng, 17);
    var u = ukuran(), z = 17;
    for (; z > 5; z--) {

      var xs = ps.map(function (p) { return p.x; }), ys = ps.map(function (p) { return p.y; });

    }

  });
  el.addEventListener('pointermove', function (e) {

}

/* ---------------- GPS & foto ---------------- */
/** Ambil titik GPS terbaik dalam ±12 detik (selesai lebih cepat bila ketelitian ≤ 20 m). */
function ambilGps() {
  return new Promise(function (ok, gagal) {
    if (!navigator.geolocation) return gagal(new Error('Perangkat ini tidak mendukung GPS'));
    var terbaik = null, selesai = false, id = null, waktu = null;
    var akhiri = function (galat) {
      if (selesai) return; selesai = true; clearTimeout(waktu); if (id !== null) navigator.geolocation.clearWatch(id);
      if (terbaik) ok(terbaik); else gagal(galat || new Error('Lokasi tidak didapat. Nyalakan GPS/lokasi lalu coba lagi.'));
    };
    id = navigator.geolocation.watchPosition(function (p) {
      var x = { lat: p.coords.latitude, lng: p.coords.longitude, akurasi: Math.max(1, Math.round(p.coords.accuracy)) };
      if (!terbaik || x.akurasi < terbaik.akurasi) terbaik = x;
      if (x.akurasi <= 20) akhiri();
    }, function (e) {
      akhiri(new Error(e && e.code === 1 ? 'Izin lokasi ditolak. Izinkan akses lokasi untuk halaman SIGAP di pengaturan browser, lalu coba lagi.' : 'Lokasi tidak didapat. Nyalakan GPS lalu coba lagi di tempat terbuka.'));
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
    waktu = setTimeout(function () { akhiri(); }, 12000);
  });
}
/** Foto diperkecil di HP (sisi terpanjang 1280 px, JPEG) agar unggah hemat kuota. */
function bacaFoto(file) {
  return new Promise(function (ok, gagal) {
    if (!file || !/^image\//.test(file.type)) return gagal(new Error('Pilih foto (JPG/PNG)'));
    var r = new FileReader();
    r.onerror = function () { gagal(new Error('Gagal membaca foto')); };
    r.onload = function () {
      var img = new Image();
      img.onload = function () {
        var k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok({ base64: c.toDataURL('image/jpeg', 0.8).split(',')[1], mime: 'image/jpeg' });
      };
      img.onerror = function () { gagal(new Error('Foto tidak bisa dibaca. Coba foto ulang.')); };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

/** Titik dari teks Google Maps (sama dengan koordinatDariTeks_ di server): pin tempat, ?q=, @lat,lng, angka, derajat-menit-detik. */
function koordinatDariTeks(t) {
  t = String(t || ''); try { t = decodeURIComponent(t); } catch (e) { /* biarkan */ }
  var m = t.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/) ||
    t.match(/[?&](?:q|query|ll|destination|center|sll)=(?:loc:)?\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/) ||
    t.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/) ||
    (/^\s*-?\d/.test(t) ? t.match(/^\s*(-?\d{1,2}(?:\.\d+)?)\s*[,;\s]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/) : null);
  if (m) return { lat: +m[1], lng: +m[2] };
  var d = t.match(/(\d+)°\s*(\d+)['′]\s*([\d.]+)["″]?\s*([NS])[\s,]+(\d+)°\s*(\d+)['′]\s*([\d.]+)["″]?\s*([EW])/i);
  if (d) {
    var la = +d[1] + d[2] / 60 + d[3] / 3600, lo = +d[5] + d[6] / 60 + d[7] / 3600;
    return { lat: /s/i.test(d[4]) ? -la : la, lng: /w/i.test(d[8]) ? -lo : lo };
  }
  return null;
}

function kontakBanyakCv() {
  var g = {}, cvById = {};

  var tambah = function (hp, nama, cvId, peran) {
    hp = hp62(hp); if (!hp || hp.length < 10 || !cvId || !cvById[cvId]) return;
    var x = g[hp] = g[hp] || { hp: hp, nama: {}, cv: {}, proyek: 0 };
    if (nama) x.nama[String(nama).trim().toUpperCase()] = true;
    x.cv[cvId] = true;
    if (peran === 'proyek') x.proyek++;
  };
  pjAktif().forEach(function (p) { tambah(p.KontakHP, p.KontakNama, p.CV_ID, 'proyek'); });
  S.d.cv.forEach(function (c) { tambah(c.Kontak, '', c.ID); KONTAK_CV.forEach(function (k) { tambah(c[k[2]], c[k[1]], c.ID); }); });
  return Object.keys(g).map(function (k) { var x = g[k]; x.daftar = Object.keys(x.cv).map(function (id) { return cvById[id]; }); x.namaTeks = Object.keys(x.nama).join(' / ') || '-'; return x; })

}

function umumTandaTab() { $$('#uTab button').forEach(function (b) { b.classList.toggle('on', b.dataset.t === UMUM.tab); }); }

/* === 70-rekon.js === */
/* ----------------------------------------------------------------------
 *  SIGAP Jakon 2.4.0 · REKONSILIASI paket SIRUP/SPSE ⇄ Proyek Jakon Aktif (keputusan Hafidz 24 Nov 2026)
 *  Proyek › Rekonsiliasi (Pemilik & Pelaksana). Empat kelompok:
 *   1. Perlu dicek   — saran pasangan paket ⇄ proyek dari kemiripan (CV/NPP, nilai, nama, kode); WAJIB dipastikan petugas
 *   2. Belum ada di laporan — paket berkontrak yang belum ditemukan di laporan Proyek Jakon → target konfirmasi kepesertaan
 *   3. Sudah terdaftar — paket yang tertaut ke proyek Jakon (dari kode = otomatis, atau dipastikan petugas)
 *   4. Proyek Jakon Pemkab tanpa paket — info (data SIRUP belum diimpor / pengadaan di luar SPSE)
 *  Paket yang dicek: berpemenang, belum Selesai/Dibatalkan, tahun data ini; tahun lalu hanya yang ditandai masih berjalan.
 *  Tindak lanjut per paket tersimpan di server (PAKET.TL*); WA per CV memuat semua paket + perkiraan iuran (tarif berlapis).
 * ---------------------------------------------------------------------- */
var TL_STATUS = ['Belum dihubungi', 'Sudah dihubungi', 'Akan didaftarkan', 'Terdaftar di KC lain', 'Bukan objek Jakon', 'Paket batal'];
var REKON_BERJALAN = ['Berjalan', 'Sudah checklist', 'Pembayaran BPJSTK', 'Ditunda'];
var REKON_AMBANG = 60;

function rekonTahun() { return Number((S.d.info && S.d.info.tahun) || new Date().getFullYear()); }
/** Paket yang perlu dipastikan kepesertaannya. */
function rekonTarget(p) {
  if (!p.Pemenang || p.Relevan === 'Tidak' || ['Selesai', 'Dibatalkan'].indexOf(p.StatusPemkab) >= 0) return false;
  var th = rekonTahun(), t = Number(p.Tahun) || th;
  if (t >= th) return true;
  return t === th - 1 && REKON_BERJALAN.indexOf(p.StatusPemkab) >= 0; // tahun lalu yang masih berjalan
}
function rekonNama(s) {
  return String(s || '').toUpperCase().replace(/\b(CV|PT|UD|KEC(AMATAN)?|DESA|DS|KAB(UPATEN)?|PAMEKASAN|DAN|DI|KE)\b/g, ' ').replace(/[^A-Z0-9]+/g, ' ').trim();
}
function rekonMirip(a, b) {
  a = rekonNama(a).replace(/ /g, ''); b = rekonNama(b).replace(/ /g, '');
  if (!a || !b) return 0; if (a === b) return 1;
  var g = function (s) { var x = {}, n = 0; for (var i = 0; i < s.length - 1; i++) { var k = s.substr(i, 2); x[k] = (x[k] || 0) + 1; n++; } return { x: x, n: n }; };
  var A = g(a), B = g(b), sama = 0;
  Object.keys(A.x).forEach(function (k) { if (B.x[k]) sama += Math.min(A.x[k], B.x[k]); });
  return A.n + B.n ? 2 * sama / (A.n + B.n) : 0;
}
function rekonTolak(pj) { return String(pj.TolakPaket || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean); }
/** Skor 0–100 pasangan paket ⇄ proyek + alasannya. */
function rekonSkor(p, pj) {
  var skor = 0, why = [];
  var kodeP = [p.KodePaket, p.KodeRUP].map(function (k) { return String(k || '').trim(); }).filter(function (k) { return k.length >= 5; }), kt = String(pj.KodeTender || '').trim();
  if (kt && kodeP.some(function (k) { return kt.indexOf(k) >= 0 || k.indexOf(kt) >= 0; })) { skor += 45; why.push('kode mirip'); }
  if (p.CV_ID && pj.CV_ID && String(p.CV_ID) === String(pj.CV_ID)) { skor += 35; why.push('CV sama'); }
  else if (rekonMirip(p.Pemenang, pj.NamaBU) >= 0.8) { skor += 25; why.push('nama CV mirip'); }
  var nk = Number(p.NilaiKontrak) || 0, np = Number(pj.NilaiProyek) || 0;
  if (nk && np) { var beda = Math.abs(nk - np) / Math.max(nk, np); if (beda <= 0.01) { skor += 30; why.push('nilai sama'); } else if (beda <= 0.05) { skor += 15; why.push('nilai mirip'); } }
  var m = rekonMirip(p.NamaPaket, pj.NamaProyek);
  if (m >= 0.4) { skor += Math.round(30 * m); why.push('nama ' + Math.round(m * 100) + '%'); }
  return { skor: Math.min(100, skor), alasan: why.join(', ') };
}
/** Semua kelompok rekonsiliasi (dihitung di perangkat dari data SIGAP). */
function rekonData() {
  var paket = S.d.paket || [], pj = proyekJakon(), tautan = {}, pjBebas = [];
  pj.forEach(function (o) {
    if (o.PAKET_ID && /^(Cocok|Manual)$/.test(o.CocokPaket || '')) (tautan[o.PAKET_ID] = tautan[o.PAKET_ID] || []).push(o);
    else if (o.Status === 'Aktif') pjBebas.push(o);
  });
  var target = paket.filter(rekonTarget), terdaftar = [], belum = [];
  target.forEach(function (p) { if (p.NoJakon || tautan[p.ID]) terdaftar.push(p); else belum.push(p); });
  // saran: semua pasangan berskor ≥ ambang, dipilih rakus (satu paket ↔ satu proyek)
  var pasangan = [];
  belum.forEach(function (p) {
    pjBebas.forEach(function (o) {
      if (rekonTolak(o).indexOf(String(p.ID)) >= 0) return;
      var srv = String(o.PAKET_ID) === String(p.ID) && /^Mirip/.test(o.CocokPaket || '');
      var pra = srv || (p.CV_ID && String(p.CV_ID) === String(o.CV_ID)) || (Number(p.NilaiKontrak) && Math.abs(Number(p.NilaiKontrak) - Number(o.NilaiProyek)) / Number(p.NilaiKontrak) <= 0.05) || String(o.KodeTender || '').length >= 5;
      if (!pra) return;
      var k = rekonSkor(p, o);
      if (srv && k.skor < REKON_AMBANG) k = { skor: REKON_AMBANG, alasan: (k.alasan ? k.alasan + ', ' : '') + 'disarankan saat unggah' };
      if (k.skor >= REKON_AMBANG) pasangan.push({ p: p, pj: o, skor: k.skor, alasan: k.alasan });
    });
  });
  pasangan.sort(function (a, b) { return b.skor - a.skor; });
  var pakai = {}, pakaiPj = {}, saran = [];
  pasangan.forEach(function (x) { if (pakai[x.p.ID] || pakaiPj[x.pj.NoProyek]) return; pakai[x.p.ID] = true; pakaiPj[x.pj.NoProyek] = true; saran.push(x); });
  var belumAda = belum.filter(function (p) { return !pakai[p.ID]; });
  var tanpaPaket = pj.filter(function (o) { return o.Status === 'Aktif' && o.KategoriPemilik === 'Pemkab Pamekasan' && !(o.PAKET_ID && /^(Cocok|Manual)$/.test(o.CocokPaket || '')) && !pakaiPj[o.NoProyek]; });
  var iur = function (p) { return KitJakon.iuran(Number(p.NilaiKontrak) || Number(p.Pagu) || 0, true).total || 0; };
  return { target: target, terdaftar: terdaftar, saran: saran, belum: belumAda, tanpaPaket: tanpaPaket, tautan: tautan, pjBebas: pjBebas,
    nilaiBelum: belumAda.reduce(function (s, p) { return s + (Number(p.NilaiKontrak) || Number(p.Pagu) || 0); }, 0), iuranBelum: belumAda.reduce(function (s, p) { return s + iur(p); }, 0), iur: iur };
}
function rekonTl(p) { return p.TLStatus || 'Belum dihubungi'; }
function rekonUmur(p) { var t = new Date(String(p.TglUmum || '').slice(0, 10)); return isNaN(t) ? '' : Math.max(0, Math.round((new Date(today()) - t) / 864e5)); }

/* ---------- Proyek › Rekonsiliasi ---------- */
function ownerRekon(el) {
  var R = rekonData(), per = perTanggalPj();
  var pct = R.target.length ? Math.round(R.terdaftar.length / R.target.length * 100) : 0;
  var kpi = function (n, l, cls, go) { return '<div class="kpi ' + (cls || '') + ' klik" data-rk="' + esc(go) + '"><div class="n">' + n + '</div><div class="l">' + esc(l) + '</div></div>'; };
  el.innerHTML = '<h2>Proyek konstruksi</h2><p class="muted" style="margin-top:-6px">Rekonsiliasi paket SIRUP/SPSE berkontrak ' + rekonTahun() + ' (dan tahun lalu yang masih berjalan) dengan laporan Proyek Jakon Aktif' + (per ? ' per ' + esc(tglPendek(per)) : '') + '. Saran pasangan dari kemiripan harus Anda pastikan.</p>' +
    '<div class="grid">' + kpi(R.terdaftar.length + ' / ' + R.target.length, 'Sudah terdaftar (' + pct + '%)', 'biru', 'Sudah terdaftar') + kpi(R.saran.length, 'Perlu dicek', 'oranye', 'Perlu dicek') +
    kpi(R.belum.length, 'Belum ada di laporan', 'merah', 'Belum ada di laporan') + kpi(jt(R.iuranBelum), 'Potensi iuran belum terdaftar', 'merah', 'Belum ada di laporan') + kpi(R.tanpaPaket.length, 'Proyek Jakon Pemkab tanpa paket', '', 'Proyek Jakon tanpa paket') + '</div>' +
    '<div class="filters" id="fRk"></div><div class="filters" id="fRk2"></div><div id="tRk"></div>';
  pilihModeProyek(el);
  var grup = [['Perlu dicek', R.saran.length], ['Belum ada di laporan', R.belum.length], ['Sudah terdaftar', R.terdaftar.length], ['Proyek Jakon tanpa paket', R.tanpaPaket.length]];
  if (!S.f.rk) S.f.rk = R.saran.length ? 'Perlu dicek' : 'Belum ada di laporan';
  var w = $('#tRk', el), f2 = $('#fRk2', el);
  var render = function () {
    var g = S.f.rk;
    f2.innerHTML = '';
    if (g === 'Perlu dicek') return tabelSaran(w, R);

      if (pilih === 'Per CV') return tabelPerCv(w, R);
      return tabelBelum(w, R, R.belum.filter(function (p) { return pilih === 'Semua' || rekonTl(p) === pilih; }));
    }
    if (g === 'Sudah terdaftar') return tabel(w, R.terdaftar, [['NamaPaket', 'Paket', 'judul-hp'], ['Pemenang', 'Pemenang'], [function (r) { return jt(r.NilaiKontrak || r.Pagu); }, 'Nilai', 'num'],
      [function (r) { var t = R.tautan[r.ID] || []; return t.length ? esc(t.map(function (o) { return o.NoProyek; }).join(', ')) + ' ' + chip(t[0].CocokPaket === 'Manual' ? 'Dipastikan petugas' : 'Kode cocok') : esc(r.NoJakon || '-'); }, 'Proyek Jakon'], ['Tahun', 'Tahun']],
      { id: 'rkSudah', hp: 1, klik: detailRekon, csv: 'paket-terdaftar-jakon', csvKolom: [['NamaPaket', 'Paket'], ['Satker', 'Satker'], ['Pemenang', 'Pemenang'], ['NilaiKontrak', 'Nilai kontrak'], ['NoJakon', 'No. proyek Jakon'], ['Tahun', 'Tahun']], kosong: 'Belum ada paket yang tertaut ke laporan Proyek Jakon.' });
    return tabel(w, R.tanpaPaket, [['NamaProyek', 'Proyek Jakon', 'judul-hp'], ['NamaBU', 'Pelaksana'], [function (r) { return jt(r.NilaiProyek); }, 'Nilai', 'num'], ['Pemilik', 'Pemilik'], ['KodeTender', 'Kode tender']],
      { id: 'rkPj', hp: 1, klik: function (o) { detailRekonPj(o, R); }, csv: 'proyek-jakon-tanpa-paket', csvKolom: [['NoProyek', 'No. proyek'], ['KodeTender', 'Kode tender'], ['NamaProyek', 'Nama proyek'], ['NamaBU', 'Pelaksana'], ['NPP', 'NPP'], ['NilaiProyek', 'Nilai'], ['Pemilik', 'Pemilik']],
        kosong: 'Semua proyek Jakon milik Pemkab sudah tertaut ke paket SIRUP/SPSE.' });
  };

  $$('[data-rk]', el).forEach(function (k) { k.onclick = function () { S.f.rk = k.dataset.rk; filterChips($('#fRk', el), 'rk', grup, render); render(); }; });

}

    [function (x) { return esc(x.pj.NamaProyek) + '<br><span class="muted">' + esc(x.pj.NoProyek) + ' · ' + esc(x.pj.NamaBU || '') + ' · ' + jt(x.pj.NilaiProyek) + '</span>'; }, 'Proyek Jakon (laporan)'],

  $$('[data-bukan]', el).forEach(function (b) { b.onclick = function (e) { e.stopPropagation(); var x = b.dataset.bukan.split('|'); busy(b, call('rekonTolak', { paketId: x[0], noProyek: x[1] })).then(function () { toast('Dicatat: bukan pasangan ini'); return muatUlang(true); }).catch(function () { }); }; });
}
function tabelBelum(w, R, rows) {

    [function (r) { return jt(r.NilaiKontrak || r.Pagu); }, 'Nilai', 'num'], [function (r) { return rp(R.iur(r)); }, 'Perkiraan iuran', 'num'],

/** Satu baris per CV: semua paketnya yang belum ada di laporan → satu WA + tandai sudah dihubungi. */
function tabelPerCv(w, R) {

  R.belum.forEach(function (p) { var k = p.CV_ID || ('N:' + p.Pemenang); var g = per[k] = per[k] || { nama: p.Pemenang, kontak: p.KontakCV, status: p.StatusCV, paket: [] }; g.paket.push(p); if (!g.kontak) g.kontak = p.KontakCV; });

    { id: 'rkCv', hp: 1, csv: 'cv-paket-belum-jakon', csvKolom: [['nama', 'CV/PT'], ['status', 'Status CV'], [function (g) { return g.paket.length; }, 'Jumlah paket'], ['nilai', 'Nilai kontrak'], [function (g) { return Math.round(g.iuran); }, 'Perkiraan iuran'], ['kontak', 'Kontak']],

      } });
}
function pesanRekonCv(nama, paket, R) {
  var L = ['Halo, kami dari BPJS Ketenagakerjaan KC Pamekasan 👋', '', 'Selamat atas paket pekerjaan konstruksi yang dikerjakan *' + (nama || 'perusahaan Bapak/Ibu') + '*:'];
  paket.forEach(function (p, i) { L.push((i + 1) + ') ' + p.NamaPaket + (p.Satker ? ' (' + p.Satker + ')' : '') + ' — nilai ' + rp(Number(p.NilaiKontrak) || Number(p.Pagu) || 0) + ', perkiraan iuran Jakon ' + rp(R.iur(p))); });

/** Rincian satu paket: kandidat proyek, tautkan, tindak lanjut. */

  var semuaBebas = R.pjBebas.slice().sort(function (a, b) { var ca = String(a.CV_ID) === String(p.CV_ID) ? 0 : 1, cb = String(b.CV_ID) === String(p.CV_ID) ? 0 : 1; return ca - cb || String(a.NamaProyek).localeCompare(String(b.NamaProyek)); });

    baris('Nilai kontrak', rp(Number(p.NilaiKontrak) || Number(p.Pagu) || 0) + ' · perkiraan iuran Jakon <b>' + rp(R.iur(p)) + '</b>') + baris('Kode paket / RUP', esc((p.KodePaket || '-') + ' / ' + (p.KodeRUP || '-'))) +
    baris('Tahun · tahap', esc((p.Tahun || '-') + ' · ' + (p.Tahap || '-') + ' · ' + (p.StatusPemkab || 'Belum dimulai'))) + '</tbody></table></div>' +
    (tertaut.length ? '<h3>Proyek Jakon tertaut</h3>' + tertaut.map(function (o) { return '<div class="baris"><span style="flex:1">' + esc(o.NoProyek) + ' · ' + esc(o.NamaProyek) + ' ' + chip(o.CocokPaket === 'Manual' ? 'Dipastikan petugas' : 'Kode cocok') + '</span><button class="btn kecil" data-lepas="' + esc(o.NoProyek) + '">Lepas</button></div>'; }).join('') :
      '<h3>Kandidat proyek di laporan Jakon</h3>' + (kand.length ? kand.map(function (x) { return '<div class="kartu" style="padding:8px 10px;margin-bottom:6px"><div class="baris"><span style="flex:1"><b>' + esc(x.pj.NamaProyek) + '</b><br><span class="muted">' + esc(x.pj.NoProyek) + ' · ' + esc(x.pj.NamaBU || '') + ' · ' + jt(x.pj.NilaiProyek) + ' · ' + esc(x.alasan) + '</span></span>' + chipSkor(x) + '</div>' +
        '<div class="aksi" style="justify-content:flex-start;margin-top:6px"><button class="btn kecil utama" data-ya="' + esc(p.ID) + '|' + esc(x.pj.NoProyek) + '">Ya, ini proyeknya</button><button class="btn kecil" data-bukan="' + esc(p.ID) + '|' + esc(x.pj.NoProyek) + '">Bukan</button></div></div>'; }).join('') : '<p class="muted">Tidak ada proyek di laporan yang mirip.</p>') +
      '<label class="f">Tautkan ke proyek lain di laporan <small>(CV yang sama di atas)</small></label><div class="baris"><select id="rkPilih" style="flex:1"><option value="">— pilih proyek —</option>' + semuaBebas.map(function (o) { return '<option value="' + esc(o.NoProyek) + '">' + esc(o.NamaProyek.slice(0, 70)) + ' · ' + esc(o.NamaBU || '') + ' · ' + jt(o.NilaiProyek) + '</option>'; }).join('') + '</select><button class="btn" id="rkTaut">Tautkan</button></div>') +
    '<h3>Tindak lanjut konfirmasi kepesertaan</h3><div class="dua"><div><label class="f">Status</label><select id="rkTl">' + TL_STATUS.map(function (s) { return '<option ' + (s === rekonTl(p) ? 'selected' : '') + '>' + esc(s) + '</option>'; }).join('') + '</select></div>' +
    '<div><label class="f">Catatan</label><input type="text" id="rkCat" maxlength="300" value="' + esc(p.TLCatatan || '') + '"></div></div>' +
    (p.TLTanggal ? '<div class="muted">Terakhir: ' + esc(String(p.TLTanggal)) + (p.TLOleh ? ' oleh ' + esc(p.TLOleh) : '') + '</div>' : '') +
    '<div class="aksi">' + (p.KontakCV ? '<a class="btn wa" target="_blank" href="' + esc(waLink(p.KontakCV, pesanRekonCv(p.Pemenang, [p], R))) + '">WA ke CV</a>' : '') + '<button class="btn" id="rkPaket">Rincian paket</button><button class="btn" data-tutup>Tutup</button><button class="btn utama" id="rkSimpan">Simpan tindak lanjut</button></div>', function (bg) {
      pasangTombolSaran(bg);
      $$('[data-ya],[data-bukan]', bg).forEach(function (b) { var asli = b.onclick; b.onclick = function (e) { asli(e); bg.remove(); }; });
      $$('[data-lepas]', bg).forEach(function (b) { b.onclick = function () { busy(b, call('rekonLepas', { noProyek: b.dataset.lepas })).then(function () { bg.remove(); toast('Tautan dilepas'); return muatUlang(true); }).catch(function () { }); }; });
      if ($('#rkTaut', bg)) $('#rkTaut', bg).onclick = function () { var no = $('#rkPilih', bg).value; if (!no) return toast('Pilih proyek', true); busy(this, call('rekonTaut', { paketId: p.ID, noProyek: no })).then(function () { bg.remove(); toast('Tertaut'); return muatUlang(true); }).catch(function () { }); };
      $('#rkPaket', bg).onclick = function () { bg.remove(); detailPaket(p); };

/** Proyek Jakon Pemkab tanpa paket → tautkan ke paket yang belum terdaftar. */

/* === 99-mulai.js === */
/* ----------------------------------------------------------------------
 *  SIGAP Jakon 2.0 · mulai: buka penyimpanan (PIN bila ada) → kode undangan bila belum masuk → tampilkan data
 *  tersimpan lebih dulu (≤ 7 hari), lalu segarkan dari server di belakang layar.
 * ---------------------------------------------------------------------- */
/** Bentuk data awal dari server disamakan untuk semua peran (Pelaksana tanpa pengaturan & akses, Pengamat tanpa pengajuan). */
function siapkanData(d) {
  d.cv = d.cv || []; d.paket = d.paket || []; d.pengajuan = d.pengajuan || []; d.pengguna = d.pengguna || []; d.akses = d.akses || []; d.impor = d.impor || []; d.lokasi = d.lokasi || [];
  d.info = d.info || {};
  d.proyekJakon = d.proyekJakon || []; d.infoProyek = d.infoProyek || { laporan: [], kategoriPemilik: [], jenisPekerjaan: [] }; // 2.3.0 (Tahap 7)
  S.d = d; S.me = d.me || {};
  return d;
}

async function mulaiSigap() {
  if (rutUmum()) return tampilUmum(); // 2.4.0: tampilan umum (penonaktifan tanpa kode akses), tanpa membuka data perangkat
  bersihkanVersiLama();
  await muatDb();
  if (SIMPAN.rekTerkunci) {
    var ok = await layarPin();
    if (!ok) return layarMasuk('Data di perangkat ini sudah dihapus. Masuk lagi dengan kode undangan baru dari petugas KC.');
  }
  if (!terdaftar()) return layarMasuk();
  var segar = DB.awal && Date.now() - (DB.sinkron.terakhirOk || 0) < KUNCI_SINKRON_MS;
  if (segar) { siapkanData(DB.awal); tampilPeran(); tandaSegar(DB.awalT); }
  else $('#app').innerHTML = '<div class="loading">' + (DB.awal ? 'Sudah lebih dari ' + HARI_KUNCI + ' hari tidak tersambung. Menyambungkan ke server…' : 'Memuat data…') + '</div>';
  try {
    var d = await call('awal');
    siapkanData(d); simpanCache(d);
    if (segar && !bolehGanti()) { tandaSegar(0, true); return; }
    tampilPeran();
  } catch (e) {
    if (!terdaftar()) return; // dicabut → layar masuk sudah tampil
    if (segar) { tandaSegar(DB.awalT, false, e.message); return; }
    $('#app').innerHTML = kartuGerbang('<div class="info" style="margin-top:14px">' + esc(e.message) + '</div><p class="muted">Data tersimpan tidak ditampilkan karena perangkat ini ' +
      (DB.awal ? 'lebih dari ' + HARI_KUNCI + ' hari tidak tersambung' : 'belum pernah memuat data') + '. Sambungkan internet lalu coba lagi.</p>' +
      '<div style="margin-top:12px"><button class="btn utama" onclick="location.reload()">Coba lagi</button></div>');
  }
}
window.addEventListener('hashchange', function () { if (rutUmum()) tampilUmum(); });
mulaiSigap();
